<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aurelia — Monster Quest</title>
<meta name="description" content="משחק הרפתקה בסגנון RPG קלאסי של אספנות מפלצות, עם גרפיקה מחודשת." />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23f04a5a'/><path d='M2 16h28' stroke='%23111' stroke-width='3'/><circle cx='16' cy='16' r='5' fill='%23fff' stroke='%23111' stroke-width='3'/></svg>" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="960" height="640"></canvas>
      <div id="overlay">
        <div id="boot">
          <div class="boot-logo">AURELIA</div>
          <div class="boot-sub">Monster Quest</div>
          <div class="boot-hint">טוען…</div>
        </div>
      </div>
    </div>

    <div id="touch" aria-hidden="true">
      <div class="dpad">
        <button data-key="ArrowUp"    class="dp up">▲</button>
        <button data-key="ArrowLeft"  class="dp left">◀</button>
        <button data-key="ArrowRight" class="dp right">▶</button>
        <button data-key="ArrowDown"  class="dp down">▼</button>
      </div>
      <div class="acts">
        <button data-key="KeyX" class="act b">B</button>
        <button data-key="KeyZ" class="act a">A</button>
        <button data-key="Enter" class="act st">☰</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
