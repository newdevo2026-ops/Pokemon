// Keyboard + on-screen gamepad, normalised into a tiny action API.
//
//   held('up')      -> true while the key is down
//   pressed('a')    -> true for exactly one frame after the key goes down
//
// `pressed` is consumed by endFrame(), which the game loop calls once per tick.

const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'a', Enter: 'a', Space: 'a',
  KeyX: 'b', Escape: 'b',
  ShiftLeft: 'run', ShiftRight: 'run',
  Tab: 'start', KeyM: 'mute',
};

// While the player is typing, letter keys must reach the text field instead of
// firing game actions — otherwise a name like "Max" would mute the game, walk
// left and back out of the screen. Only Enter and Escape stay bound.
const TEXT_MODE_KEYS = { Enter: 'a', Escape: 'b' };

class Input {
  constructor(target = window) {
    this.down = new Set();
    this.justDown = new Set();
    this.justUp = new Set();
    this.anyKeySince = 0;
    this.textMode = false;

    target.addEventListener('keydown', (e) => {
      if (e.code === 'Tab') e.preventDefault();   // never let focus jump away
      const a = this.textMode ? TEXT_MODE_KEYS[e.code] : KEYMAP[e.code];
      if (!a) return;
      if (!this.textMode) e.preventDefault();
      if (!this.down.has(a)) this.justDown.add(a);
      this.down.add(a);
      this.anyKeySince++;
    });
    target.addEventListener('keyup', (e) => {
      const a = this.textMode ? TEXT_MODE_KEYS[e.code] : KEYMAP[e.code];
      if (!a) return;
      if (!this.textMode) e.preventDefault();
      this.down.delete(a);
      this.justUp.add(a);
    });
    window.addEventListener('blur', () => this.down.clear());

    this._bindTouch();
  }

  _bindTouch() {
    const buttons = document.querySelectorAll('#touch [data-key]');
    for (const btn of buttons) {
      const action = KEYMAP[btn.dataset.key];
      if (!action) continue;
      const press = (e) => {
        e.preventDefault();
        if (!this.down.has(action)) this.justDown.add(action);
        this.down.add(action);
        this.anyKeySince++;
      };
      const release = (e) => {
        e.preventDefault();
        this.down.delete(action);
        this.justUp.add(action);
      };
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    }
  }

  held(a) { return this.down.has(a); }
  pressed(a) { return this.justDown.has(a); }
  released(a) { return this.justUp.has(a); }

  /** First held direction, in a fixed priority order (matches classic RPG feel). */
  direction() {
    if (this.down.has('up')) return 'up';
    if (this.down.has('down')) return 'down';
    if (this.down.has('left')) return 'left';
    if (this.down.has('right')) return 'right';
    return null;
  }

  pressedDirection() {
    for (const d of ['up', 'down', 'left', 'right']) {
      if (this.justDown.has(d)) return d;
    }
    return null;
  }

  endFrame() {
    this.justDown.clear();
    this.justUp.clear();
  }

  clear() {
    this.down.clear();
    this.justDown.clear();
    this.justUp.clear();
  }
}

class AudioEngine {
  constructor() {

    this.master = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.muted = false;
    this.current = null;

    this._song = song;
    this._step = 0;

    this._timer = setInterval(() => this._schedule(), 25);

  stop() {
    if (this._timer) { clearInterval(this._timer); this._timer = null; }

    if (!song || !this.ctx) return;
    const stepDur = 60 / song.bpm / 4;
    while (this._nextTime < this.ctx.currentTime + 0.25) {
      const t = this._nextTime;

      this._emit(song.bass, this._step, t, stepDur, 'triangle', 0.22, -12);
      if (song.pad) this._emit(song.pad, this._step, t, stepDur * 4, 'sine', 0.07, 0);

  try { return !!localStorage.getItem(KEY); } catch { return false; }

    return true;
  } catch (e) {

    return false;
  }

  try {

    if (!raw) return null;
    return JSON.parse(raw);

    return null;
  }
}

  try { localStorage.removeItem(KEY); } catch {}

      ctx.strokeStyle = tone(acc, -6, 0, 0.5); ctx.lineWidth = rx * 0.16; ctx.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * rx * 0.4, cy - ry);
        ctx.quadraticCurveTo(cx + i * rx * 0.4 + rx * 0.12, cy, cx + i * rx * 0.4, cy + ry);
        ctx.stroke();
      }
      break;
    case 'spots':
      ctx.fillStyle = tone(acc, +4, 0, 0.45);
      for (let i = 0; i < 7; i++) {
        const a = rng() * 6.28, r = rng();
        ctx.beginPath();
        ctx.ellipse(cx + Math.cos(a) * rx * r * 0.85, cy + Math.sin(a) * ry * r * 0.85,
          rx * (0.1 + rng() * 0.1), ry * (0.1 + rng() * 0.1), 0, 0, 7);
        ctx.fill();
      }
      break;
    case 'plates':
      ctx.strokeStyle = tone(d.pal[0], -22, 0, 0.65); ctx.lineWidth = rx * 0.08;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.2, rx * (0.3 + i * 0.24), ry * (0.3 + i * 0.24), 0, Math.PI * 1.05, Math.PI * 1.95);
        ctx.stroke();
      }
      break;
    case 'swirl':
      ctx.strokeStyle = tone(acc, +8, 0, 0.55); ctx.lineWidth = rx * 0.1; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 46; i++) {
        const a = i * 0.28, r = (i / 46) * rx * 0.8;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r * (ry / rx);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
      break;
    default: break;
  }
  ctx.restore();
}

function drawWings(ctx, d, cx, cy, r, t, out, behind) {
  const flap = Math.sin(t * 5.2);
  const acc = d.pal[2];
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(cx + s * r * 0.4, cy - r * 0.25);
    ctx.rotate(s * (0.25 + flap * 0.32));
    ctx.scale(s, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(r * 1.5, -r * 1.3, r * 2.15, -r * 0.15);
    ctx.quadraticCurveTo(r * 1.5, r * 0.18, r * 1.65, r * 0.75);
    ctx.quadraticCurveTo(r * 0.8, r * 0.35, 0, r * 0.42);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -r, r * 2, r);
    g.addColorStop(0, tone(d.pal[1], +12, 0, behind ? 0.75 : 0.95));
    g.addColorStop(1, tone(acc, -2, 0, behind ? 0.6 : 0.9));
    fillStroke(ctx, g, out, 2.6);
    ctx.beginPath();
    ctx.moveTo(r * 0.2, r * 0.05); ctx.lineTo(r * 1.75, -r * 0.5);
    ctx.moveTo(r * 0.2, r * 0.18); ctx.lineTo(r * 1.5, r * 0.3);
    ctx.lineWidth = 1.8; ctx.strokeStyle = tone(d.pal[0], -18, 0, 0.5); ctx.stroke();
    ctx.restore();
  }
}

// ------------------------------------------------------------------ auras --
function drawAura(ctx, d, t, back) {
  const a = d.aura;
  if (!a) return;
  const rng = makeRng(7);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const n = 9;
  for (let i = 0; i < n; i++) {
    const ph = (t * (a === 'ice' ? 0.35 : 0.75) + i / n) % 1;
    const ax = (rng() - 0.5) * 92;
    const ay = 46 - ph * 100;
    const fade = Math.sin(ph * Math.PI);
    const size = 3 + rng() * 4;
    ctx.globalAlpha = fade * (back ? 0.35 : 0.55);
    switch (a) {
      case 'fire': ctx.fillStyle = hsl(20 + rng() * 30, 100, 62); break;
      case 'spark': ctx.fillStyle = hsl(50, 100, 70); break;
      case 'leaf': ctx.fillStyle = hsl(100 + rng() * 40, 70, 60); break;
      case 'bubble': ctx.fillStyle = hsl(196, 90, 74); break;
      case 'shadow': ctx.fillStyle = hsl(268, 60, 40); break;
      case 'light': ctx.fillStyle = hsl(48, 100, 80); break;
      case 'ice': ctx.fillStyle = hsl(188, 90, 82); break;
      case 'poison': ctx.fillStyle = hsl(290, 70, 62); break;
      case 'wind': ctx.fillStyle = hsl(200, 40, 88); break;
      default: ctx.fillStyle = '#fff';
    }
    if (a === 'spark') {
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.lineTo(ax + 4, ay + 6); ctx.lineTo(ax - 2, ay + 7); ctx.lineTo(ax + 3, ay + 14);
      ctx.stroke();
    } else if (a === 'leaf') {
      ctx.beginPath();
      ctx.ellipse(ax, ay, size * 1.5, size * 0.7, ph * 6, 0, 7); ctx.fill();
    } else if (a === 'ice') {
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let k = 0; k < 3; k++) {
        const an = k * 1.047 + ph * 2;
        ctx.moveTo(ax - Math.cos(an) * size, ay - Math.sin(an) * size);
        ctx.lineTo(ax + Math.cos(an) * size, ay + Math.sin(an) * size);
      }
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(ax, ay, size, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

// ------------------------------------------------------------ body layouts --
function drawQuad(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0], belly = d.pal[1];
  const bx = 2, by = 12 + breathe * 1.5;
  const rx = 30, ry = 20 * (1 + breathe * 0.05);
  const hx = 26, hy = -12 + breathe * 2;
  const hr = 20;

  // back legs
  for (const s of [0, 1]) {
    const lx = bx + (s ? 18 : -18), lift = Math.sin(t * 2 + s * 3) * 1.5;
    limbPath(ctx, lx, by + 8, lx - 2, by + 20, lx - 1, 44 + lift, 8, 6);
    fillStroke(ctx, tone(c, -14), out, 2.8);
  }
  drawTail(ctx, d, bx - rx * 0.9, by - 2, t, out);
  // torso
  blobPath(ctx, bx, by, rx, ry, 0.1, rng);
  fillStroke(ctx, bodyGradient(ctx, bx, by, rx, ry, c), out, 3.4);
  // belly
  ctx.beginPath(); ctx.ellipse(bx + 2, by + ry * 0.42, rx * 0.62, ry * 0.5, 0, 0, 7);
  ctx.fillStyle = tone(belly, +6, -6, 0.75); ctx.fill();
  drawMarkings(ctx, d, bx, by, rx, ry, rng);
  if (d.wings) drawWings(ctx, d, bx - 4, by - 6, 16, t, out, false);
  // front legs
  for (const s of [0, 1]) {
    const lx = bx + (s ? 22 : 8), lift = Math.sin(t * 2 + s * 2 + 1.5) * 1.5;
    limbPath(ctx, lx, by + 6, lx + 2, by + 20, lx + 1, 44 + lift, 7.5, 5.5);
    fillStroke(ctx, tone(c, s ? -4 : -12), out, 2.8);
  }
  // head
  blobPath(ctx, hx, hy, hr, hr * 0.92, 0.08, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3.4);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    // muzzle
    ctx.beginPath(); ctx.ellipse(hx + 8, hy + 7, 11, 8, 0, 0, 7);
    ctx.fillStyle = tone(belly, +8, -8, 0.9); ctx.fill();
    drawEyes(ctx, d, hx + 2, hy - 3, 8, 1, blink, false);
    ctx.beginPath(); ctx.ellipse(hx + 13, hy + 4, 2.6, 2.1, 0, 0, 7);
    ctx.fillStyle = outlineOf(c); ctx.fill();
    drawMouth(ctx, d, hx + 11, hy + 10, 11, 1, mouthOpen);
  }
}

function drawBiped(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0], belly = d.pal[1];
  const bx = 0, by = 8 + breathe * 1.5;
  const rx = 22, ry = 26 * (1 + breathe * 0.04);
  const hx = 0, hy = -28 + breathe * 2, hr = 19;

  if (d.wings) drawWings(ctx, d, bx, by - 10, 18, t, out, true);
  drawTail(ctx, d, bx - rx * 0.8, by + 12, t, out);
  // legs
  for (const s of [-1, 1]) {
    limbPath(ctx, bx + s * 10, by + ry * 0.6, bx + s * 13, by + ry * 0.9, bx + s * 12, 45, 9, 7);
    fillStroke(ctx, tone(c, s < 0 ? -14 : -4), out, 3);
    ctx.beginPath(); ctx.ellipse(bx + s * 13, 45, 10, 5, 0, 0, 7);
    fillStroke(ctx, tone(d.pal[2], -4), out, 2.4);
  }
  // torso
  blobPath(ctx, bx, by, rx, ry, 0.08, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, bx, by, rx, ry, c), out, 3.4);
  ctx.beginPath(); ctx.ellipse(bx, by + 4, rx * 0.6, ry * 0.62, 0, 0, 7);
  ctx.fillStyle = tone(belly, +6, -6, 0.7); ctx.fill();
  drawMarkings(ctx, d, bx, by, rx, ry, rng);
  // arms
  for (const s of [-1, 1]) {
    const swing = Math.sin(t * 1.9 + (s > 0 ? 1.6 : 0)) * 3;
    limbPath(ctx, bx + s * rx * 0.75, by - 10, bx + s * (rx + 8), by + 2 + swing, bx + s * (rx + 6), by + 16 + swing, 7, 5.5);
    fillStroke(ctx, tone(c, s > 0 ? -3 : -13), out, 2.8);
    ctx.beginPath(); ctx.arc(bx + s * (rx + 6), by + 18 + swing, 6.5, 0, 7);
    fillStroke(ctx, tone(d.pal[2], 0), out, 2.4);
  }
  // head
  blobPath(ctx, hx, hy, hr, hr, 0.07, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3.4);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    drawEyes(ctx, d, hx, hy - 2, 8, 1, blink, false);
    drawMouth(ctx, d, hx, hy + 9, 12, 1, mouthOpen);
  }
}

function drawSerpent(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0];
  const wave = Math.sin(t * 1.6);
  // coiled body: a chain of shrinking circles along an S curve
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const p = i / 12;
    pts.push([
      -26 + p * 46 + Math.sin(p * 4 + wave) * 10,
      44 - p * 58 + Math.cos(p * 3.2 + wave * 0.8) * 6,
    ]);
  }
  drawTail(ctx, d, pts[0][0], pts[0][1], t, out, 0.9);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = 30; ctx.strokeStyle = out; ctx.stroke();
  ctx.lineWidth = 24;
  const g = ctx.createLinearGradient(-30, 40, 30, -40);
  g.addColorStop(0, tone(c, -12)); g.addColorStop(0.5, tone(c, +8)); g.addColorStop(1, tone(c, -4));
  ctx.strokeStyle = g; ctx.stroke();
  ctx.lineWidth = 9; ctx.strokeStyle = tone(d.pal[1], +6, -6, 0.55); ctx.stroke();

  const hx = pts[12][0] + 6, hy = pts[12][1] - 6, hr = 18;
  if (d.wings) drawWings(ctx, d, hx - 14, hy + 16, 15, t, out, true);
  blobPath(ctx, hx, hy, hr * 1.1, hr * 0.9, 0.06, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3.2);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    drawEyes(ctx, d, hx + 2, hy - 2, 8, 1, blink, true);
    drawMouth(ctx, d, hx + 6, hy + 9, 12, 1, mouthOpen);
  }
}

function drawAvian(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0], belly = d.pal[1];
  const bx = 0, by = 6 + breathe * 2;
  const rx = 22, ry = 26;
  drawWings(ctx, d, bx, by - 6, 17, t, out, true);
  drawTail(ctx, d, bx - 6, by + ry * 0.75, t, out);
  for (const s of [-1, 1]) {
    limbPath(ctx, bx + s * 7, by + ry * 0.7, bx + s * 8, by + ry * 0.95, bx + s * 8, 45, 3.4, 2.8);
    fillStroke(ctx, tone(d.pal[2], -6), out, 2.2);
    ctx.beginPath();
    ctx.moveTo(bx + s * 8 - 6, 46); ctx.lineTo(bx + s * 8 + 6, 46);
    ctx.lineWidth = 3; ctx.strokeStyle = tone(d.pal[2], -6); ctx.lineCap = 'round'; ctx.stroke();
  }
  blobPath(ctx, bx, by, rx, ry, 0.07, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, bx, by, rx, ry, c), out, 3.4);
  ctx.beginPath(); ctx.ellipse(bx, by + 6, rx * 0.6, ry * 0.6, 0, 0, 7);
  ctx.fillStyle = tone(belly, +8, -8, 0.75); ctx.fill();
  drawMarkings(ctx, d, bx, by, rx, ry, rng);
  drawWings(ctx, d, bx, by - 6, 17, t + 0.02, out, false);
  const hx = 4, hy = -26 + breathe * 2, hr = 16;
  blobPath(ctx, hx, hy, hr, hr, 0.06, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3.2);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    ctx.beginPath();
    ctx.moveTo(hx + 10, hy + 1); ctx.lineTo(hx + 26, hy + 5 + mouthOpen * 4); ctx.lineTo(hx + 10, hy + 9);
    ctx.closePath();
    fillStroke(ctx, tone(d.pal[2], +6), out, 2.4);
    drawEyes(ctx, d, hx, hy - 2, 7, 0.95, blink, false);
  }
}

function drawInsect(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0];
  const hover = Math.sin(t * 3) * 3;
  const bx = 0, by = 10 + hover;
  if (d.wings) drawWings(ctx, d, bx, by - 14, 19, t * 1.9, out, true);
  // abdomen segments
  for (let i = 3; i >= 0; i--) {
    const seg = 1 - i * 0.14;
    ctx.beginPath();
    ctx.ellipse(bx - 4 - i * 3, by + i * 9, 15 * seg, 12 * seg, 0, 0, 7);
    fillStroke(ctx, bodyGradient(ctx, bx, by + i * 9, 15, 12, i % 2 ? d.pal[1] : c), out, 2.6);
  }
  for (const s of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const a = -0.5 + i * 0.5;
      limbPath(ctx, bx + s * 8, by + i * 6 - 2, bx + s * 20, by + i * 7 + 4,
        bx + s * 26, by + i * 8 + 14 + Math.sin(t * 3 + i) * 2, 2.6, 1.8);
      fillStroke(ctx, tone(c, -18), out, 1.8);
    }
  }
  const hx = 6, hy = -20 + hover, hr = 15;
  blobPath(ctx, hx, hy, hr, hr * 0.95, 0.06, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    drawEyes(ctx, d, hx, hy - 1, 7.5, 1, blink, false);
    drawMouth(ctx, d, hx, hy + 9, 8, 1, mouthOpen);
  }
  if (d.wings) drawWings(ctx, d, bx, by - 14, 15, t * 1.9 + 0.4, out, false);
}

function drawAquatic(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0], belly = d.pal[1];
  const bob = Math.sin(t * 2.2) * 3;
  const bx = 0, by = 8 + bob;
  const rx = 26, ry = 28;
  drawTail(ctx, d, bx - rx * 0.85, by + 6, t, out);
  // dorsal fin
  ctx.beginPath();
  ctx.moveTo(bx - 4, by - ry * 0.85);
  ctx.quadraticCurveTo(bx + 4, by - ry * 1.5, bx + 14, by - ry * 0.7);
  ctx.closePath();
  fillStroke(ctx, tone(d.pal[2], +6, 0, 0.92), out, 2.4);
  blobPath(ctx, bx, by, rx, ry, 0.07, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, bx, by, rx, ry, c), out, 3.4);
  ctx.beginPath(); ctx.ellipse(bx + 2, by + ry * 0.28, rx * 0.62, ry * 0.55, 0, 0, 7);
  ctx.fillStyle = tone(belly, +8, -6, 0.72); ctx.fill();
  drawMarkings(ctx, d, bx, by, rx, ry, rng);
  // side fins
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(bx + s * rx * 0.75, by + 4); ctx.rotate(s * (0.4 + Math.sin(t * 3) * 0.15));
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.quadraticCurveTo(s * 18, 2, 0, 12); ctx.closePath();
    fillStroke(ctx, tone(d.pal[2], +4, 0, 0.9), out, 2.2);
    ctx.restore();
  }
  drawEars(ctx, d, bx, by - ry * 0.6, 16, t, out);
  if (!back) {
    drawEyes(ctx, d, bx + 2, by - ry * 0.35, 9, 1, blink, false);
    drawMouth(ctx, d, bx + 4, by - ry * 0.02, 12, 1, mouthOpen);
  }
}

function drawGolem(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0];
  const by = 8 + breathe * 1.2;
  const chunk = (x, y, w, h, rot, col) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    const r = Math.min(w, h) * 0.22;
    ctx.moveTo(-w + r, -h);
    ctx.arcTo(w, -h, w, h, r); ctx.arcTo(w, h, -w, h, r);
    ctx.arcTo(-w, h, -w, -h, r); ctx.arcTo(-w, -h, w, -h, r);
    ctx.closePath();
    fillStroke(ctx, bodyGradient(ctx, 0, 0, w, h, col), out, 3);
    ctx.restore();
  };
  chunk(-22, by + 22, 10, 8, -0.12, [c[0], c[1], c[2] - 10]);
  chunk(22, by + 22, 10, 8, 0.12, [c[0], c[1], c[2] - 10]);
  chunk(0, by, 28, 24, 0.03, c);
  drawMarkings(ctx, d, 0, by, 26, 22, rng);
  chunk(-30, by - 4, 9, 12, -0.3, d.pal[1]);
  chunk(30, by - 4, 9, 12, 0.3, d.pal[1]);
  chunk(0, by - 30, 18, 14, -0.02, [c[0], c[1], c[2] + 4]);
  drawEars(ctx, d, 0, by - 30, 16, t, out);
  if (!back) {
    drawEyes(ctx, d, 0, by - 31, 8, 0.95, blink, true);
    drawMouth(ctx, d, 0, by - 21, 12, 1, mouthOpen);
  }
}

function drawSpirit(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0];
  const bob = Math.sin(t * 1.8) * 4;
  const cx = 0, cy = -4 + bob, rx = 26, ry = 26;
  if (d.wings) drawWings(ctx, d, cx, cy, 18, t * 1.4, out, true);
  drawTail(ctx, d, cx - 6, cy + ry * 0.7, t, out);
  // wispy skirt
  ctx.beginPath();
  ctx.moveTo(cx - rx, cy + 4);
  ctx.quadraticCurveTo(cx - rx * 0.6, cy + ry * 1.5, cx - rx * 0.3, cy + ry * 1.1 + Math.sin(t * 3) * 3);
  ctx.quadraticCurveTo(cx, cy + ry * 1.7, cx + rx * 0.3, cy + ry * 1.1 + Math.sin(t * 3 + 2) * 3);
  ctx.quadraticCurveTo(cx + rx * 0.7, cy + ry * 1.5, cx + rx, cy + 4);
  ctx.closePath();
  fillStroke(ctx, bodyGradient(ctx, cx, cy + ry, rx, ry, c), out, 3);
  blobPath(ctx, cx, cy, rx, ry, 0.09, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, cx, cy, rx, ry, c), out, 3.4);
  drawMarkings(ctx, d, cx, cy, rx, ry, rng);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
  const gg = ctx.createRadialGradient(cx, cy, 2, cx, cy, rx * 1.7);
  gg.addColorStop(0, tone(d.pal[2], +20)); gg.addColorStop(1, tone(d.pal[2], 0, 0, 0));
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(cx, cy, rx * 1.7, 0, 7); ctx.fill();
  ctx.restore();
  drawEars(ctx, d, cx, cy, 20, t, out);
  if (!back) {
    drawEyes(ctx, d, cx, cy - 3, 9, 1.05, blink, false);
    drawMouth(ctx, d, cx, cy + 10, 11, 1, mouthOpen);
  }
  if (d.wings) drawWings(ctx, d, cx, cy, 15, t * 1.4 + 0.3, out, false);
}

const LAYOUTS = {
  quad: drawQuad, biped: drawBiped, serpent: drawSerpent, avian: drawAvian,
  insect: drawInsect, aquatic: drawAquatic, golem: drawGolem, spirit: drawSpirit,
};

// ------------------------------------------------------------------- API ---
/**
 * @param {CanvasRenderingContext2D} ctx
 * @param {string} speciesId
 * @param {number} x  centre x on screen
 * @param {number} y  ground line (feet) on screen
 * @param {number} size  pixel height of the 100-unit box
 * @param {object} o  { t, back, alpha, flash, shake, squash, shadow, faint }
 */
function drawMonster(ctx, speciesId, x, y, size, o = {}) {
  const sp = getSpecies(speciesId);
  if (!sp) return;
  const d = sp.design;
  const t = o.t ?? 0;
  const back = !!o.back;
  const alpha = o.alpha ?? 1;
  const scale = (size / 100) * (d.size ?? 1) * (o.scale ?? 1);
  const rng = makeRng(hashStr(speciesId) ^ 0x9e37);
  const out = outlineOf(d.pal[0]);

  const breathe = Math.sin(t * 1.7) * 0.5 + 0.5;
  const blinkPhase = (t * 0.45 + (sp.dex % 7) * 0.13) % 1;
  const blink = blinkPhase > 0.965 ? 1 : 0;
  const mouthOpen = o.mouthOpen ?? 0;

  ctx.save();
  ctx.globalAlpha = alpha;
  if (o.shake) ctx.translate((Math.random() - 0.5) * o.shake, (Math.random() - 0.5) * o.shake);

  // ground shadow
  if (o.shadow !== false) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.3;
    const sw = 34 * scale, sh = 9 * scale;
    const sg = ctx.createRadialGradient(x, y, 0, x, y, sw);

// Pause menu and its sub-screens: party, summary, bag, catalogue, trainer card,

const W = 960, H = 640;
const ROOT_ITEMS = [

class MenuSystem {
  constructor(game) {

    this.t = 0;

    if (this.toastT > 0) this.toastT -= dt;
    if (!this.open) return;
    const s = this.top;
    switch (s.id) {
      case 'root': return this.updateRoot(s, input);
      case 'party': return this.updateParty(s, input);
      case 'summary': return this.updateSummary(s, input);
      case 'bag': return this.updateBag(s, input);
      case 'dex': return this.updateDex(s, input);
      case 'card': return this.updateSimple(s, input);
      case 'save': return this.updateSave(s, input);
      case 'shop': return this.updateShop(s, input);

      if (d === 'down') n += cols;
      if (d === 'left') n += 1;

    }
    this.push({ t: 'msg', text: `קדימה, ${displayName(this.battle.me)}!` });
    this.push({ t: 'sendout', side: 'player', creature: this.battle.me });
    this.push({ t: 'menu' });
  }

  push(e) { this.queue.push(e); }
  pushFront(list) { this.queue.unshift(...list); }

  // ------------------------------------------------------------ update --
  update(dt, input) {
    this.t += dt;
    this.entering = Math.max(0, this.entering - dt * 1.6);
    this.P.update(dt);
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const f = this.fx[i];
      f.update(dt);
      if (f.shake) this.shake = Math.max(this.shake, f.shake);
      if (f.t >= f.dur) this.fx.splice(i, 1);
    }
    this.shake *= Math.pow(0.02, dt);
    this.flashAlpha = Math.max(0, this.flashAlpha - dt * 3);
    for (const k of ['foeFlash', 'meFlash']) {
      this.disp[k] = Math.max(0, this.disp[k] - dt * 4);
    }
    if (this.ballAnim) this.updateBall(dt);

    if (this.menu) this.updateMenu(dt, input);
    else this.updateEvents(dt, input);
  }

  // --------------------------------------------------- event playback ---
  updateEvents(dt, input) {
    if (!this.current) {
      if (!this.queue.length) {
        if (this.finished) { if (!this.closed) { this.closed = true; this.onEnd(this.result, this.battle); } }
        else this.menu = 'main';
        return;
      }
      this.current = this.queue.shift();
      this.startEvent(this.current);
      if (!this.current) return;
    }
    const e = this.current;
    e.time = (e.time ?? 0) + dt;

    switch (e.t) {
      case 'msg': {
        const speed = 42;
        this.msgShown = Math.min(this.msg.length, this.msgShown + speed * dt);
        if (input.pressed('a') || input.pressed('b')) {
          if (this.msgShown < this.msg.length) this.msgShown = this.msg.length;
          else this.current = null;
        } else if (this.msgShown >= this.msg.length) {
          if (e.time > (e.hold ?? 0.85)) this.current = null;
        }
        break;
      }
      case 'anim':
        if (e.time > (e.dur ?? 0.55)) this.current = null;
        break;
      case 'hp': {
        const k = clamp(e.time / 0.7, 0, 1);
        const key = e.side === 'player' ? 'meHp' : 'foeHp';
        this.disp[key] = lerp(e.fromR, e.toR, easeOutCubic(k));
        if (k >= 1) this.current = null;
        break;
      }
      case 'faint': {
        const k = clamp(e.time / 0.8, 0, 1);
        const side = e.side === 'player' ? 'me' : 'foe';
        this.disp[side + 'Y'] = k * 120;
        this.disp[side + 'Alpha'] = 1 - k;
        if (k >= 1) this.current = null;
        break;
      }
      case 'sendout': {
        const k = clamp(e.time / 0.55, 0, 1);
        const side = e.side === 'player' ? 'me' : 'foe';
        this.disp[side + 'Alpha'] = Math.min(1, k * 2);
        this.disp[side + 'Scale'] = easeOutBack(k);
        this.disp[side + 'Y'] = 0;
        if (k >= 1) { this.disp[side + 'Scale'] = 1; this.current = null; }
        break;
      }
      case 'withdraw': {
        const k = clamp(e.time / 0.35, 0, 1);
        const side = e.side === 'player' ? 'me' : 'foe';
        this.disp[side + 'Scale'] = 1 - k;
        this.disp[side + 'Alpha'] = 1 - k;
        if (k >= 1) this.current = null;
        break;
      }
      case 'expbar': {
        const k = clamp(e.time / 0.8, 0, 1);
        this.disp.meExp = lerp(e.from, e.to, easeOutCubic(k));
        if (k >= 1) this.current = null;
        break;
      }
      case 'ball':
        if (!this.ballAnim) this.current = null;
        break;
      case 'evolveRun': {
        const k = clamp(e.time / 3.0, 0, 1);
        this.evo.t = k;
        if (!e.swapped && k >= 0.55) {
          e.swapped = true;
          evolveInto(this.evo.creature, this.evo.to);
          this.audio.cry(getSpecies(this.evo.to).cry * 7 + 13);
          this.P.burst(W / 2, H / 2 - 30, 60, {
            color: '#ffe9a0', speed: 380, ttl: 0.9, size: 8, glow: true, shape: 'star',
          });
        }
        if (k >= 1) { this.current = null; }
        break;
      }
      case 'wait':
        if (e.time > (e.dur ?? 0.4)) this.current = null;
        break;
      default:
        this.current = null;
    }
  }

  startEvent(e) {
    switch (e.t) {
      case 'msg':
        this.msg = e.text; this.msgShown = 0;
        break;
      case 'cry': {
        const c = this.battle.actor(e.side);
        this.audio.cry(getSpecies(c.species).cry * 7 + 13);
        this.current = null;
        break;
      }
      case 'anim': {
        const from = e.side === 'player' ? this.mePoint() : this.foePoint();
        const to = e.side === 'player' ? this.foePoint() : this.mePoint();
        const move = e.move ? getMove(e.move) : null;
        const fx = createFx(e.fx, from, to, this.P, e.type || move?.type || 'neutral');
        this.fx.push(fx);
        e.dur = Math.min(fx.dur, 0.8);
        if (!e.status) this.audio.sfx('hit');
        break;
      }
      case 'hp': {
        const max = e.max || (e.side === 'player' ? this.shownMe : this.shownFoe).stats.hp;
        e.fromR = clamp(e.from / max, 0, 1);
        e.toR = clamp(e.to / max, 0, 1);
        if (e.to < e.from) {
          this.disp[e.side === 'player' ? 'meFlash' : 'foeFlash'] = 1;
          this.shake = Math.max(this.shake, e.eff > 1 ? 12 : 6);
          if (e.eff > 1) this.audio.sfx('super');
          else if (e.eff < 1 && e.eff > 0) this.audio.sfx('weak');
        } else this.audio.sfx('heal');
        break;
      }
      case 'faint':
        this.audio.sfx('faint');
        break;
      case 'status':
        this.audio.sfx('wobble');
        this.current = null;
        break;
      case 'stat':
        this.P.burst(
          e.side === 'player' ? ME.x : FOE.x,
          (e.side === 'player' ? ME.y : FOE.y) - 40,
          22,
          { color: e.up ? '#8ef0b4' : '#f09a8a', speed: 120, ttl: 0.7, size: 5, glow: true,
            angle: e.up ? -1.57 : 1.57, spread: 1.6 });
        this.audio.sfx(e.up ? 'select' : 'back');
        this.current = null;
        break;
      case 'sendout':
        this.audio.cry(getSpecies(e.creature.species).cry * 7 + 13);
        if (e.side === 'player') this.shownMe = e.creature; else this.shownFoe = e.creature;
        if (e.side === 'foe') this.state.see(e.creature.species);
        if (e.side === 'player') {
          this.disp.meHp = hpRatio(e.creature);
          const x = expToNext(e.creature);
          this.disp.meExp = x.into / x.span;
        } else this.disp.foeHp = hpRatio(e.creature);
        break;
      case 'exp':
        this.handleExp(e);
        this.current = null;
        break;
      case 'ball':
        this.startBall(e);
        break;
      case 'forceSwitch':
        this.forcedSwitch = true;
        this.menu = 'party';
        this.cursor = this.battle.party.findIndex((c) => c.hp > 0);
        this.current = null;
        break;
      case 'menu':
        this.menu = 'main'; this.cursor = 0;
        this.current = null;
        break;
      case 'levelup':
        this.audio.sfx('levelup');
        this.P.burst(ME.x, ME.y - 120, 34, {
          color: '#ffe9a0', speed: 210, ttl: 0.9, size: 6, shape: 'star',
          glow: true, angle: -1.57, spread: 2.4,
        });
        this.disp.meExp = 0;
        this.current = null;
        break;
      case 'learnPrompt':
        this.learnCreature = e.creature;
        this.learnMove = e.move;
        this.cursor = 0;
        this.menu = 'learn';
        this.current = null;
        break;
      case 'evolveStart':
        this.evo = { creature: e.creature, to: e.to, from: e.creature.species, t: 0 };
        this.audio.play('victory');
        this.current = null;
        break;
      case 'evolveEnd':
        this.evo = null;
        this.audio.play(this.kind === 'trainer' ? 'battle' : 'battle');
        this.current = null;
        break;
      case 'end':
        this.finishBattle(e);
        this.current = null;
        break;
      default:
        break;
    }
  }

  handleExp(e) {
    const c = e.creature;
    const inserted = [];
    const x = expToNext(c);
    inserted.push({ t: 'msg', text: `${displayName(c)} קיבל ${e.amount} נקודות ניסיון!`, hold: 0.4 });
    inserted.push({ t: 'expbar', from: this.disp.meExp, to: c === this.battle.me ? x.into / x.span : this.disp.meExp });
    for (const lv of e.result.levels) {
      inserted.push({ t: 'levelup', creature: c, level: lv });
      inserted.push({ t: 'msg', text: `${displayName(c)} עלה לרמה ${lv}!` });
    }
    for (const mv of e.result.learned) {
      inserted.push({ t: 'msg', text: `${displayName(c)} למד ${getMove(mv).name}!` });
    }
    for (const p of e.result.pending) {
      inserted.push({ t: 'msg', text: `${displayName(c)} מנסה ללמוד ${getMove(p.move).name}…` });
      inserted.push({ t: 'msg', text: `אבל הוא כבר יודע ארבעה מהלכים!` });
      inserted.push({ t: 'learnPrompt', creature: c, move: p.move });
    }
    if (e.result.evolve) {
      const toName = getSpecies(e.result.evolve).name;
      inserted.push({ t: 'msg', text: `מה?! ${displayName(c)} משנה צורה!` });
      inserted.push({ t: 'evolveStart', creature: c, to: e.result.evolve });
      inserted.push({ t: 'evolveRun' });
      inserted.push({ t: 'msg', text: `מזל טוב! ${displayName(c)} הפך ל${toName}!` });
      inserted.push({ t: 'evolveEnd' });
    }
    this.pushFront(inserted);
  }

  startBall(e) {
    const item = getItem(e.item);
    this.audio.sfx('ball');
    this.ballAnim = {
      phase: 'throw', t: 0, shakes: e.shakes, caught: e.caught,
      shakeIndex: 0, color: item.color,
    };
  }

  updateBall(dt) {
    const b = this.ballAnim;
    b.t += dt;
    if (b.phase === 'throw' && b.t > 0.55) {
      b.phase = 'suck'; b.t = 0;
      this.disp.foeScale = 1;
    } else if (b.phase === 'suck') {
      this.disp.foeScale = Math.max(0, 1 - b.t / 0.35);
      this.disp.foeAlpha = Math.max(0, 1 - b.t / 0.35);
      if (b.t > 0.45) { b.phase = 'wobble'; b.t = 0; }
    } else if (b.phase === 'wobble') {
      if (b.t > 0.75) {
        b.t = 0;
        b.shakeIndex++;
        if (b.shakeIndex <= b.shakes) this.audio.sfx('wobble');
        if (b.shakeIndex > b.shakes) {
          if (b.caught) { b.phase = 'caught'; this.audio.sfx('caught'); }
          else { b.phase = 'escape'; this.audio.sfx('escape'); }
        }
      }
    } else if (b.phase === 'escape') {
      this.disp.foeScale = Math.min(1, b.t / 0.3);
      this.disp.foeAlpha = Math.min(1, b.t / 0.3);
      if (b.t > 0.4) { this.ballAnim = null; this.disp.foeScale = 1; this.disp.foeAlpha = 1; }
    } else if (b.phase === 'caught') {
      if (b.t > 0.9) this.ballAnim = null;
    }
  }

  // ------------------------------------------------------------- menus --
  updateMenu(dt, input) {
    const A = input.pressed('a'), B = input.pressed('b');
    const dir = input.pressedDirection();
    const move = (n) => { this.cursor = n; this.audio.sfx('cursor'); };

    if (this.menu === 'main') {
      // 2x2: קרב / תיק / צוות / בריחה
      if (dir === 'left') move((this.cursor % 2 === 0) ? this.cursor + 1 : this.cursor - 1);
      if (dir === 'right') move((this.cursor % 2 === 0) ? this.cursor + 1 : this.cursor - 1);
      if (dir === 'up' && this.cursor >= 2) move(this.cursor - 2);
      if (dir === 'down' && this.cursor < 2) move(this.cursor + 2);
      if (A) {
        this.audio.sfx('select');
        if (this.cursor === 0) { this.menu = 'moves'; this.subCursor = 0; }
        else if (this.cursor === 1) { this.menu = 'bag'; this.subCursor = 0; this.scroll = 0; }
        else if (this.cursor === 2) { this.menu = 'party'; this.subCursor = 0; }
        else { this.commit({ type: 'run' }); }
      }
      return;
    }

    if (this.menu === 'moves') {
      const moves = this.battle.me.moves;
      // Out of PP on every move: the only option is Struggle.
      if (moves.every((m) => m.pp <= 0)) {
        if (B) { this.audio.sfx('back'); this.menu = 'main'; return; }
        if (A) { this.audio.sfx('select'); this.commit({ type: 'move', index: -1 }); }
        return;
      }
      if (dir === 'left' || dir === 'right') {
        this.subCursor = this.subCursor % 2 === 0 ? this.subCursor + 1 : this.subCursor - 1;
        this.audio.sfx('cursor');
      }
      if (dir === 'up' && this.subCursor >= 2) { this.subCursor -= 2; this.audio.sfx('cursor'); }
      if (dir === 'down' && this.subCursor < 2) { this.subCursor += 2; this.audio.sfx('cursor'); }
      this.subCursor = clamp(this.subCursor, 0, moves.length - 1);
      if (B) { this.audio.sfx('back'); this.menu = 'main'; return; }
      if (A) {
        const slot = moves[this.subCursor];
        if (!slot || slot.pp <= 0) { this.audio.sfx('bump'); return; }
        this.audio.sfx('select');
        this.commit({ type: 'move', index: this.subCursor });
      }
      return;
    }

    if (this.menu === 'bag') {
      const items = this.state.itemList().filter((i) => {
        const it = getItem(i.id);
        return it && it.kind !== 'key';
      });
      if (dir === 'up') { this.subCursor = Math.max(0, this.subCursor - 1); this.audio.sfx('cursor'); }
      if (dir === 'down') { this.subCursor = Math.min(items.length - 1, this.subCursor + 1); this.audio.sfx('cursor'); }
      if (B) { this.audio.sfx('back'); this.menu = 'main'; return; }
      if (A && items.length) {
        const it = items[this.subCursor];
        const def = getItem(it.id);
        this.audio.sfx('select');
        if (def.kind === 'ball') {
          if (this.kind === 'trainer') {
            this.flashMessage('אסור לגנוב את היצורים של מאמן אחר!');
            return;
          }
          this.commit({ type: 'item', id: it.id });
        } else {
          this.pendingItem = it.id;
          this.menu = 'party';
          this.itemTarget = true;
          this.subCursor = 0;
        }
      }
      return;
    }

    if (this.menu === 'party') {
      const party = this.battle.party;
      if (dir === 'up') { this.cursor = Math.max(0, this.cursor - 1); this.audio.sfx('cursor'); }
      if (dir === 'down') { this.cursor = Math.min(party.length - 1, this.cursor + 1); this.audio.sfx('cursor'); }
      if (B && !this.forcedSwitch) {
        this.audio.sfx('back');
        this.menu = this.itemTarget ? 'bag' : 'main';
        this.itemTarget = false; this.pendingItem = null;
        return;
      }
      if (A) {
        const target = party[this.cursor];
        if (this.itemTarget) {
          this.audio.sfx('select');
          const id = this.pendingItem;
          this.itemTarget = false; this.pendingItem = null;
          this.commit({ type: 'item', id, targetIndex: this.cursor });
          return;
        }
        if (target.hp <= 0) { this.audio.sfx('bump'); this.flashMessage(`${displayName(target)} לא מסוגל להילחם!`); return; }
        if (this.cursor === this.battle.pIndex && !this.forcedSwitch) {
          this.audio.sfx('bump'); this.flashMessage(`${displayName(target)} כבר בזירה!`); return;
        }
        this.audio.sfx('select');
        if (this.forcedSwitch) {
          this.forcedSwitch = false;
          this.menu = null;
          const ev = [];
          this.battle.switchIn('player', this.cursor, ev);
          this.pushFront(this.translate(ev));
          this.push({ t: 'menu' });
        } else {
          this.commit({ type: 'switch', index: this.cursor });
        }
      }
      return;
    }

    if (this.menu === 'learn') {
      const c = this.learnCreature;
      const n = c.moves.length + 1;
      if (dir === 'up') { this.cursor = (this.cursor + n - 1) % n; this.audio.sfx('cursor'); }
      if (dir === 'down') { this.cursor = (this.cursor + 1) % n; this.audio.sfx('cursor'); }
      if (A || B) {
        this.audio.sfx('select');
        const newMove = this.learnMove;
        const idx = this.cursor;
        this.menu = null;
        if (B || idx === c.moves.length) {
          this.pushFront([{ t: 'msg', text: `${displayName(c)} ויתר על לימוד ${getMove(newMove).name}.` }]);
        } else {
          const old = getMove(c.moves[idx].id).name;
          c.moves[idx] = makeMoveSlot(newMove);
          this.pushFront([
            { t: 'msg', text: `1, 2 ו… פוף!` },
            { t: 'msg', text: `${displayName(c)} שכח את ${old} ולמד ${getMove(newMove).name}!` },
          ]);
        }
      }
      return;
    }
  }

  flashMessage(text) {
    this.msg = text; this.msgShown = text.length;
    this.msgFlash = 1.6;
  }

  commit(action) {
    this.menu = null;
    const ev = this.battle.takeTurn(action);
    this.queue = this.translate(ev);
    if (!this.battle.over && !this.queue.some((e) => e.t === 'forceSwitch')) {
      this.queue.push({ t: 'menu' });
    }
  }

  /** Turn engine events into scene events (adds move metadata for the fx). */
  translate(ev) {
    return ev.map((e) => ({ ...e }));
  }

  finishBattle(e) {
    this.finished = true;
    this.result = e.result;
    this.menu = null;
    if (e.result === 'win' || e.result === 'caught') this.audio.play('victory');
    if (e.result === 'win' && this.kind === 'trainer') {
      this.state.addMoney(this.trainer.reward);
    }
    if (e.result === 'caught') {
      const c = e.creature;
      this.state.catchDex(c.species);
      const where = this.state.addToParty(c);
      this.pushFront([
        { t: 'msg', text: where === 'party'
          ? `${displayName(c)} הצטרף לצוות!`
          : `${displayName(c)} נשלח לתיבת האחסון.` },
      ]);
    }
    this.push({ t: 'wait', dur: 0.35 });
  }

  // -------------------------------------------------------------- draw --
  foePoint() { return { x: FOE.x, y: FOE.y - 80 }; }
  mePoint() { return { x: ME.x, y: ME.y - 100 }; }

  draw(ctx) {
    ctx.save();
    if (this.shake > 0.4) {
      ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }
    this.drawBackground(ctx);

    // --- combatants
    const foe = this.shownFoe;
    const me = this.shownMe;
    if (foe && this.disp.foeAlpha > 0.01) {
      drawMonster(ctx, foe.species, FOE.x, FOE.y + this.disp.foeY, FOE.size, {
        t: this.t, alpha: this.disp.foeAlpha, scale: this.disp.foeScale,
        flash: this.disp.foeFlash, flashColor: '#ff8a7a',
      });
    }
    if (me && this.disp.meAlpha > 0.01) {
      drawMonster(ctx, me.species, ME.x, ME.y + this.disp.meY, ME.size, {
        t: this.t, back: true, alpha: this.disp.meAlpha, scale: this.disp.meScale,
        flash: this.disp.meFlash, flashColor: '#ff8a7a',
      });
    }

    for (const f of this.fx) f.draw(ctx);
    this.P.draw(ctx);
    if (this.ballAnim) this.drawBall(ctx);

    // --- HUD
    if (foe) this.drawFoePanel(ctx, foe);
    if (me) this.drawMePanel(ctx, me);

    this.drawBottom(ctx);

    if (this.evo) this.drawEvolve(ctx);
    vignette(ctx, W, H, 0.4);
    if (this.entering > 0) {
      ctx.fillStyle = `rgba(0,0,0,${this.entering})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  drawBackground(ctx) {
    const cave = this.terrain === 'cave';
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (cave) { g.addColorStop(0, '#151a2e'); g.addColorStop(0.6, '#1d2136'); g.addColorStop(1, '#0e1120'); }
    else { g.addColorStop(0, '#63b6e8'); g.addColorStop(0.45, '#a9dcf2'); g.addColorStop(0.55, '#cfe9c8'); g.addColorStop(1, '#5f9b57'); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (!cave) {
      // distant hills
      ctx.fillStyle = 'rgba(90,150,110,.55)';
      ctx.beginPath();
      ctx.moveTo(0, 340);
      for (let x = 0; x <= W; x += 40) {
        ctx.lineTo(x, 330 + Math.sin(x * 0.006 + 1.2) * 34 + Math.sin(x * 0.017) * 12);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      // sun glow
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const sg = ctx.createRadialGradient(180, 90, 10, 180, 90, 220);
      sg.addColorStop(0, 'rgba(255,240,190,.45)'); sg.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = sg; ctx.fillRect(0, 0, 460, 380);
      ctx.restore();
    } else {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 5; i++) {
        const x = 120 + i * 190, y = 90 + Math.sin(i * 2.1) * 40;
        const cg = ctx.createRadialGradient(x, y, 4, x, y, 130);
        cg.addColorStop(0, 'rgba(120,190,230,.16)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = cg; ctx.fillRect(x - 140, y - 140, 280, 280);
      }
      ctx.restore();
    }

    // platforms
    const plat = (x, y, rx, ry, hue) => {
      const pg = ctx.createRadialGradient(x, y, 4, x, y, rx);
      pg.addColorStop(0, hsl(hue, cave ? 10 : 45, cave ? 34 : 44));
      pg.addColorStop(0.75, hsl(hue, cave ? 10 : 40, cave ? 24 : 34));
