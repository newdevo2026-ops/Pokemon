// migrate, and small enough that three slots cost nothing.

const KEY = 'aurelia.save.v1';

function hasSave() {
  try { return !!localStorage.getItem(KEY); } catch { return false; }
}

  try {
    localStorage.setItem(KEY, JSON.stringify({ ...data, savedAt: Date.now(), meta }));
    return true;
  } catch (e) {
    console.warn('save failed', e);
    return false;
  }
}

  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.warn('load failed', e);
    return null;
  }
}

function deleteSave() {
  try { localStorage.removeItem(KEY); } catch {}
}

    map: d.player?.map ?? '—',

    caught: Object.keys(d.dex?.caught || {}).length,

function drawEyes(ctx, d, x, y, spread, scale, blink, angry) {
  const kind = d.eyes;
  const white = '#ffffff';
  const dark = '#141024';
  for (const s of [-1, 1]) {
    const ex = x + s * spread, ey = y;
    if (blink > 0.5) {
      ctx.beginPath();
      ctx.moveTo(ex - 5 * scale, ey); ctx.lineTo(ex + 5 * scale, ey);
      ctx.lineWidth = 2.4 * scale; ctx.strokeStyle = dark; ctx.lineCap = 'round'; ctx.stroke();
      continue;
    }
    ctx.save();
    if (kind === 'glow') {
      const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 9 * scale);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.35, tone(d.pal[2], +26));
      g.addColorStop(1, tone(d.pal[2], -6, 0, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ex, ey, 9 * scale, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, 3.1 * scale, 0, 7); ctx.fill();
    } else if (kind === 'multi') {
      for (let i = 0; i < 3; i++) {
        const ox = (i - 1) * 3.6 * scale, oy = Math.abs(i - 1) * 1.6 * scale;
        ctx.fillStyle = i === 1 ? white : tone(d.pal[2], +10);
        ctx.beginPath(); ctx.ellipse(ex + ox, ey + oy, 2.9 * scale, 3.6 * scale, 0, 0, 7); ctx.fill();
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.arc(ex + ox, ey + oy, 1.5 * scale, 0, 7); ctx.fill();
      }
    } else {
      const ry = kind === 'sleepy' ? 3.4 : kind === 'sharp' ? 4.4 : 5.4;
      ctx.fillStyle = white;
      ctx.beginPath(); ctx.ellipse(ex, ey, 4.6 * scale, ry * scale, 0, 0, 7); ctx.fill();
      ctx.lineWidth = 1.4 * scale; ctx.strokeStyle = '#2a2440'; ctx.stroke();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.ellipse(ex + s * 0.8 * scale, ey + 0.6 * scale, 2.5 * scale, 3.2 * scale, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath(); ctx.arc(ex + s * 1.6 * scale, ey - 1.5 * scale, 1.3 * scale, 0, 7); ctx.fill();
    }
    // brow
    if (kind === 'sharp' || angry) {
      ctx.beginPath();
      ctx.moveTo(ex - s * 6 * scale, ey - 7 * scale);
      ctx.lineTo(ex + s * 5 * scale, ey - 4.2 * scale);
      ctx.lineWidth = 2.6 * scale; ctx.strokeStyle = outlineOf(d.pal[0]); ctx.lineCap = 'round'; ctx.stroke();
    }
    ctx.restore();
  }
}

function drawMouth(ctx, d, x, y, w, scale, open) {
  ctx.beginPath();
  if (open > 0.02) {
    ctx.ellipse(x, y + 1 * scale, w * 0.7, (2 + open * 5) * scale, 0, 0, 7);
    ctx.fillStyle = '#5c2434'; ctx.fill();
    ctx.lineWidth = 1.8 * scale; ctx.strokeStyle = outlineOf(d.pal[0]); ctx.stroke();
  } else {
    ctx.moveTo(x - w * 0.5, y);
    ctx.quadraticCurveTo(x, y + 3.2 * scale, x + w * 0.5, y);
    ctx.lineWidth = 2.2 * scale; ctx.strokeStyle = outlineOf(d.pal[0]);
    ctx.lineCap = 'round'; ctx.stroke();
  }
}

function drawEars(ctx, d, hx, hy, hr, t, out) {
  const c = d.pal[0], acc = d.pal[2];
  const twitch = Math.sin(t * 2.1) * 0.09;
  for (const s of [-1, 1]) {
    const bx = hx + s * hr * 0.62, by = hy - hr * 0.66;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(s * (0.35 + twitch));
    switch (d.ears) {
      case 'pointy':
        ctx.beginPath();
        ctx.moveTo(-hr * 0.34, 0); ctx.quadraticCurveTo(0, -hr * 1.25, hr * 0.32, hr * 0.06);
        ctx.quadraticCurveTo(0, hr * 0.2, -hr * 0.34, 0);
        fillStroke(ctx, bodyGradient(ctx, 0, -hr * 0.5, hr * 0.4, hr * 0.7, c), out, 2.8);
        ctx.beginPath();
        ctx.moveTo(-hr * 0.16, -hr * 0.06); ctx.quadraticCurveTo(0, -hr * 0.85, hr * 0.15, -hr * 0.02);
        ctx.closePath(); ctx.fillStyle = tone(acc, +6, 0, 0.85); ctx.fill();
        break;
      case 'round':
        ctx.beginPath(); ctx.ellipse(0, -hr * 0.42, hr * 0.42, hr * 0.5, s * 0.2, 0, 7);
        fillStroke(ctx, bodyGradient(ctx, 0, -hr * 0.4, hr * 0.42, hr * 0.5, c), out, 2.8);
        ctx.beginPath(); ctx.ellipse(0, -hr * 0.4, hr * 0.2, hr * 0.26, 0, 0, 7);
        ctx.fillStyle = tone(acc, +8, 0, 0.8); ctx.fill();
        break;
      case 'horns':
        ctx.beginPath();
        ctx.moveTo(-hr * 0.2, hr * 0.1);
        ctx.quadraticCurveTo(hr * 0.1, -hr * 1.1, hr * 0.55, -hr * 1.25);
        ctx.quadraticCurveTo(hr * 0.12, -hr * 0.7, hr * 0.24, hr * 0.12);
        ctx.closePath();
        fillStroke(ctx, tone(acc, +4), out, 2.6);
        break;
      case 'fins':
        ctx.beginPath();
        ctx.moveTo(0, hr * 0.1);
        ctx.quadraticCurveTo(hr * 0.5, -hr * 0.6, hr * 0.95, -hr * 0.2);
        ctx.quadraticCurveTo(hr * 0.5, -hr * 0.05, 0, hr * 0.3);
        ctx.closePath();
        fillStroke(ctx, tone(acc, +10, 0, 0.92), out, 2.4);
        break;
      case 'antenna':
        ctx.beginPath();
        ctx.moveTo(0, hr * 0.1);
        ctx.quadraticCurveTo(s * hr * 0.2, -hr * 0.9, s * hr * 0.55 + Math.sin(t * 2.4 + s) * 2, -hr * 1.25);
        ctx.lineWidth = 2.6; ctx.strokeStyle = out; ctx.lineCap = 'round'; ctx.stroke();
        ctx.beginPath();
        ctx.arc(s * hr * 0.55 + Math.sin(t * 2.4 + s) * 2, -hr * 1.25, hr * 0.16, 0, 7);
        fillStroke(ctx, tone(acc, +14), out, 2);
        break;
      default: break;
    }
    ctx.restore();
  }
}

function drawTail(ctx, d, bx, by, t, out, scale = 1) {
  if (!d.tail || d.tail === 'none') return;
  const sway = Math.sin(t * 2.3) * 8 * scale;
  const acc = d.pal[2], c = d.pal[0];
  ctx.save();
  switch (d.tail) {
    case 'flame': {
      const tipX = bx - 22 * scale, tipY = by - 26 * scale + sway * 0.4;
      limbPath(ctx, bx, by, bx - 14 * scale, by - 6 * scale, tipX, tipY, 5 * scale, 3 * scale);
      fillStroke(ctx, bodyGradient(ctx, bx, by, 14 * scale, 14 * scale, c), out, 2.8);
      for (let i = 0; i < 3; i++) {
        const f = 1 - i * 0.28;
        const wob = Math.sin(t * 7 + i * 1.7) * 3 * scale;
        ctx.beginPath();
        ctx.moveTo(tipX - 7 * scale * f, tipY + 3 * scale);
        ctx.quadraticCurveTo(tipX - 3 * scale + wob, tipY - 20 * scale * f, tipX + 1 * scale + wob, tipY - 26 * scale * f);
        ctx.quadraticCurveTo(tipX + 8 * scale * f, tipY - 14 * scale * f, tipX + 7 * scale * f, tipY + 3 * scale);
        ctx.closePath();
        ctx.fillStyle = i === 0 ? hsl(14, 92, 54, .95) : i === 1 ? hsl(34, 96, 60, .95) : hsl(48, 100, 74, .95);
        ctx.fill();
      }
      break;
    }
    case 'leaf': {
      const tipX = bx - 24 * scale, tipY = by - 18 * scale + sway * 0.3;
      limbPath(ctx, bx, by, bx - 14 * scale, by - 2 * scale, tipX, tipY, 4.5 * scale, 2.4 * scale);
      fillStroke(ctx, tone(c, -6), out, 2.6);
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(tipX, tipY + 2 * scale);
        ctx.quadraticCurveTo(tipX + s * 16 * scale, tipY - 14 * scale, tipX + s * 3 * scale, tipY - 20 * scale);
        ctx.quadraticCurveTo(tipX - s * 3 * scale, tipY - 10 * scale, tipX, tipY + 2 * scale);
        ctx.closePath();
        fillStroke(ctx, tone(acc, +6), out, 2.2);
      }
      break;
    }
    case 'bushy': {
      const tipX = bx - 20 * scale, tipY = by - 22 * scale + sway * 0.5;
      limbPath(ctx, bx, by, bx - 16 * scale, by - 4 * scale, tipX, tipY, 6 * scale, 9 * scale);
      fillStroke(ctx, bodyGradient(ctx, tipX, tipY, 14 * scale, 14 * scale, c), out, 2.8);
      ctx.beginPath(); ctx.ellipse(tipX - 2 * scale, tipY - 4 * scale, 7 * scale, 6 * scale, 0, 0, 7);
      ctx.fillStyle = tone(d.pal[1], +6, 0, 0.9); ctx.fill();
      break;
    }
    case 'spike': {
      const tipX = bx - 26 * scale, tipY = by - 14 * scale + sway * 0.4;
      ctx.beginPath();
      ctx.moveTo(bx, by - 6 * scale);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(bx, by + 6 * scale);
      ctx.closePath();
      fillStroke(ctx, tone(acc, 0), out, 2.6);
      break;
    }
    case 'fin': {
      const tipX = bx - 26 * scale, tipY = by - 16 * scale + sway * 0.5;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(tipX + 6 * scale, tipY + 12 * scale, tipX - 4 * scale, tipY + 16 * scale);
      ctx.quadraticCurveTo(tipX + 2 * scale, tipY, tipX - 6 * scale, tipY - 12 * scale);
      ctx.quadraticCurveTo(tipX + 8 * scale, tipY - 6 * scale, bx, by - 4 * scale);
      ctx.closePath();
      fillStroke(ctx, tone(acc, +8, 0, 0.92), out, 2.4);
      break;
    }
    case 'wisp': {
      ctx.beginPath();
      ctx.moveTo(bx - 8 * scale, by - 6 * scale);
      for (let i = 1; i <= 5; i++) {
        const p = i / 5;
        ctx.lineTo(bx - 8 * scale - p * 26 * scale,
                   by - 6 * scale + Math.sin(t * 3 + p * 5) * 8 * scale * p);
      }
      ctx.lineWidth = 7 * scale * 0.9; ctx.lineCap = 'round';
      ctx.strokeStyle = tone(c, -4, 0, 0.7); ctx.stroke();
      ctx.lineWidth = 3 * scale; ctx.strokeStyle = tone(d.pal[1], +8, 0, 0.55); ctx.stroke();
      break;
    }
    default: break;
  }
  ctx.restore();
}

function drawMarkings(ctx, d, cx, cy, rx, ry, rng) {
  const acc = d.pal[2];
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.clip();
  switch (d.markings) {
    case 'stripes':
      ctx.strokeStyle = tone(acc, -6, 0, 0.5); ctx.lineWidth = rx * 0.16; ctx.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * rx * 0.4, cy - ry);
        ctx.quadraticCurveTo(cx + i * rx * 0.4 + rx * 0.12, cy, cx + i * rx * 0.4, cy + ry);
        ctx.stroke();
      }
      break;
    case 'spots':
      ctx.fillStyle = tone(acc, +4, 0, 0.45);
      for (let i = 0; i < 7; i++) {
        const a = rng() * 6.28, r = rng();
        ctx.beginPath();
        ctx.ellipse(cx + Math.cos(a) * rx * r * 0.85, cy + Math.sin(a) * ry * r * 0.85,
          rx * (0.1 + rng() * 0.1), ry * (0.1 + rng() * 0.1), 0, 0, 7);
        ctx.fill();
      }
      break;
    case 'plates':
      ctx.strokeStyle = tone(d.pal[0], -22, 0, 0.65); ctx.lineWidth = rx * 0.08;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.2, rx * (0.3 + i * 0.24), ry * (0.3 + i * 0.24), 0, Math.PI * 1.05, Math.PI * 1.95);
        ctx.stroke();
      }
      break;
    case 'swirl':
      ctx.strokeStyle = tone(acc, +8, 0, 0.55); ctx.lineWidth = rx * 0.1; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 46; i++) {
        const a = i * 0.28, r = (i / 46) * rx * 0.8;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r * (ry / rx);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
      break;
    default: break;
  }
  ctx.restore();
}

function drawWings(ctx, d, cx, cy, r, t, out, behind) {
  const flap = Math.sin(t * 5.2);
  const acc = d.pal[2];
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(cx + s * r * 0.4, cy - r * 0.25);
    ctx.rotate(s * (0.25 + flap * 0.32));
    ctx.scale(s, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(r * 1.5, -r * 1.3, r * 2.15, -r * 0.15);
    ctx.quadraticCurveTo(r * 1.5, r * 0.18, r * 1.65, r * 0.75);
    ctx.quadraticCurveTo(r * 0.8, r * 0.35, 0, r * 0.42);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -r, r * 2, r);
    g.addColorStop(0, tone(d.pal[1], +12, 0, behind ? 0.75 : 0.95));
    g.addColorStop(1, tone(acc, -2, 0, behind ? 0.6 : 0.9));
    fillStroke(ctx, g, out, 2.6);
    ctx.beginPath();
    ctx.moveTo(r * 0.2, r * 0.05); ctx.lineTo(r * 1.75, -r * 0.5);
    ctx.moveTo(r * 0.2, r * 0.18); ctx.lineTo(r * 1.5, r * 0.3);
    ctx.lineWidth = 1.8; ctx.strokeStyle = tone(d.pal[0], -18, 0, 0.5); ctx.stroke();
    ctx.restore();
  }
}

// ------------------------------------------------------------------ auras --
function drawAura(ctx, d, t, back) {
  const a = d.aura;
  if (!a) return;
  const rng = makeRng(7);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const n = 9;
  for (let i = 0; i < n; i++) {
    const ph = (t * (a === 'ice' ? 0.35 : 0.75) + i / n) % 1;
    const ax = (rng() - 0.5) * 92;
    const ay = 46 - ph * 100;
    const fade = Math.sin(ph * Math.PI);
    const size = 3 + rng() * 4;
    ctx.globalAlpha = fade * (back ? 0.35 : 0.55);
    switch (a) {
      case 'fire': ctx.fillStyle = hsl(20 + rng() * 30, 100, 62); break;
      case 'spark': ctx.fillStyle = hsl(50, 100, 70); break;
      case 'leaf': ctx.fillStyle = hsl(100 + rng() * 40, 70, 60); break;
      case 'bubble': ctx.fillStyle = hsl(196, 90, 74); break;
      case 'shadow': ctx.fillStyle = hsl(268, 60, 40); break;
      case 'light': ctx.fillStyle = hsl(48, 100, 80); break;
      case 'ice': ctx.fillStyle = hsl(188, 90, 82); break;
      case 'poison': ctx.fillStyle = hsl(290, 70, 62); break;
      case 'wind': ctx.fillStyle = hsl(200, 40, 88); break;
      default: ctx.fillStyle = '#fff';
    }
    if (a === 'spark') {
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.lineTo(ax + 4, ay + 6); ctx.lineTo(ax - 2, ay + 7); ctx.lineTo(ax + 3, ay + 14);
      ctx.stroke();
    } else if (a === 'leaf') {
      ctx.beginPath();
      ctx.ellipse(ax, ay, size * 1.5, size * 0.7, ph * 6, 0, 7); ctx.fill();
    } else if (a === 'ice') {
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let k = 0; k < 3; k++) {
        const an = k * 1.047 + ph * 2;
        ctx.moveTo(ax - Math.cos(an) * size, ay - Math.sin(an) * size);
        ctx.lineTo(ax + Math.cos(an) * size, ay + Math.sin(an) * size);
      }
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(ax, ay, size, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

// ------------------------------------------------------------ body layouts --
function drawQuad(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0], belly = d.pal[1];
  const bx = 2, by = 12 + breathe * 1.5;
  const rx = 30, ry = 20 * (1 + breathe * 0.05);
  const hx = 26, hy = -12 + breathe * 2;
  const hr = 20;

  // back legs
  for (const s of [0, 1]) {
    const lx = bx + (s ? 18 : -18), lift = Math.sin(t * 2 + s * 3) * 1.5;
    limbPath(ctx, lx, by + 8, lx - 2, by + 20, lx - 1, 44 + lift, 8, 6);
    fillStroke(ctx, tone(c, -14), out, 2.8);
  }
  drawTail(ctx, d, bx - rx * 0.9, by - 2, t, out);
  // torso
  blobPath(ctx, bx, by, rx, ry, 0.1, rng);
  fillStroke(ctx, bodyGradient(ctx, bx, by, rx, ry, c), out, 3.4);
  // belly
  ctx.beginPath(); ctx.ellipse(bx + 2, by + ry * 0.42, rx * 0.62, ry * 0.5, 0, 0, 7);
  ctx.fillStyle = tone(belly, +6, -6, 0.75); ctx.fill();
  drawMarkings(ctx, d, bx, by, rx, ry, rng);
  if (d.wings) drawWings(ctx, d, bx - 4, by - 6, 16, t, out, false);
  // front legs
  for (const s of [0, 1]) {
    const lx = bx + (s ? 22 : 8), lift = Math.sin(t * 2 + s * 2 + 1.5) * 1.5;
    limbPath(ctx, lx, by + 6, lx + 2, by + 20, lx + 1, 44 + lift, 7.5, 5.5);
    fillStroke(ctx, tone(c, s ? -4 : -12), out, 2.8);
  }
  // head
  blobPath(ctx, hx, hy, hr, hr * 0.92, 0.08, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3.4);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    // muzzle
    ctx.beginPath(); ctx.ellipse(hx + 8, hy + 7, 11, 8, 0, 0, 7);
    ctx.fillStyle = tone(belly, +8, -8, 0.9); ctx.fill();
    drawEyes(ctx, d, hx + 2, hy - 3, 8, 1, blink, false);
    ctx.beginPath(); ctx.ellipse(hx + 13, hy + 4, 2.6, 2.1, 0, 0, 7);
    ctx.fillStyle = outlineOf(c); ctx.fill();
    drawMouth(ctx, d, hx + 11, hy + 10, 11, 1, mouthOpen);
  }
}

function drawBiped(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0], belly = d.pal[1];
  const bx = 0, by = 8 + breathe * 1.5;
  const rx = 22, ry = 26 * (1 + breathe * 0.04);
  const hx = 0, hy = -28 + breathe * 2, hr = 19;

  if (d.wings) drawWings(ctx, d, bx, by - 10, 18, t, out, true);
  drawTail(ctx, d, bx - rx * 0.8, by + 12, t, out);
  // legs
  for (const s of [-1, 1]) {
    limbPath(ctx, bx + s * 10, by + ry * 0.6, bx + s * 13, by + ry * 0.9, bx + s * 12, 45, 9, 7);
    fillStroke(ctx, tone(c, s < 0 ? -14 : -4), out, 3);
    ctx.beginPath(); ctx.ellipse(bx + s * 13, 45, 10, 5, 0, 0, 7);
    fillStroke(ctx, tone(d.pal[2], -4), out, 2.4);
  }
  // torso
  blobPath(ctx, bx, by, rx, ry, 0.08, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, bx, by, rx, ry, c), out, 3.4);
  ctx.beginPath(); ctx.ellipse(bx, by + 4, rx * 0.6, ry * 0.62, 0, 0, 7);
  ctx.fillStyle = tone(belly, +6, -6, 0.7); ctx.fill();
  drawMarkings(ctx, d, bx, by, rx, ry, rng);
  // arms
  for (const s of [-1, 1]) {
    const swing = Math.sin(t * 1.9 + (s > 0 ? 1.6 : 0)) * 3;
    limbPath(ctx, bx + s * rx * 0.75, by - 10, bx + s * (rx + 8), by + 2 + swing, bx + s * (rx + 6), by + 16 + swing, 7, 5.5);
    fillStroke(ctx, tone(c, s > 0 ? -3 : -13), out, 2.8);
    ctx.beginPath(); ctx.arc(bx + s * (rx + 6), by + 18 + swing, 6.5, 0, 7);
    fillStroke(ctx, tone(d.pal[2], 0), out, 2.4);
  }
  // head
  blobPath(ctx, hx, hy, hr, hr, 0.07, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3.4);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    drawEyes(ctx, d, hx, hy - 2, 8, 1, blink, false);
    drawMouth(ctx, d, hx, hy + 9, 12, 1, mouthOpen);
  }
}

function drawSerpent(ctx, d, t, back, out, rng, breathe, blink, mouthOpen) {
  const c = d.pal[0];
  const wave = Math.sin(t * 1.6);
  // coiled body: a chain of shrinking circles along an S curve
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const p = i / 12;
    pts.push([
      -26 + p * 46 + Math.sin(p * 4 + wave) * 10,
      44 - p * 58 + Math.cos(p * 3.2 + wave * 0.8) * 6,
    ]);
  }
  drawTail(ctx, d, pts[0][0], pts[0][1], t, out, 0.9);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = 30; ctx.strokeStyle = out; ctx.stroke();
  ctx.lineWidth = 24;
  const g = ctx.createLinearGradient(-30, 40, 30, -40);
  g.addColorStop(0, tone(c, -12)); g.addColorStop(0.5, tone(c, +8)); g.addColorStop(1, tone(c, -4));
  ctx.strokeStyle = g; ctx.stroke();
  ctx.lineWidth = 9; ctx.strokeStyle = tone(d.pal[1], +6, -6, 0.55); ctx.stroke();

  const hx = pts[12][0] + 6, hy = pts[12][1] - 6, hr = 18;
  if (d.wings) drawWings(ctx, d, hx - 14, hy + 16, 15, t, out, true);
  blobPath(ctx, hx, hy, hr * 1.1, hr * 0.9, 0.06, rng, 12);
  fillStroke(ctx, bodyGradient(ctx, hx, hy, hr, hr, c), out, 3.2);
  drawEars(ctx, d, hx, hy, hr, t, out);
  if (!back) {
    drawEyes(ctx, d, hx + 2, hy - 2, 8, 1, blink, true);

// ------------------------------------------------------------------- API ---
/**
 * @param {CanvasRenderingContext2D} ctx
 * @param {string} speciesId
 * @param {number} x  centre x on screen
 * @param {number} y  ground line (feet) on screen
 * @param {number} size  pixel height of the 100-unit box
 * @param {object} o  { t, back, alpha, flash, shake, squash, shadow, faint }
 */
function drawMonster(ctx, speciesId, x, y, size, o = {}) {
  const sp = getSpecies(speciesId);
  if (!sp) return;
  const d = sp.design;
  const t = o.t ?? 0;
  const back = !!o.back;
  const alpha = o.alpha ?? 1;
  const scale = (size / 100) * (d.size ?? 1) * (o.scale ?? 1);
  const rng = makeRng(hashStr(speciesId) ^ 0x9e37);
  const out = outlineOf(d.pal[0]);

  const breathe = Math.sin(t * 1.7) * 0.5 + 0.5;
  const blinkPhase = (t * 0.45 + (sp.dex % 7) * 0.13) % 1;
  const blink = blinkPhase > 0.965 ? 1 : 0;
  const mouthOpen = o.mouthOpen ?? 0;

  ctx.save();
  ctx.globalAlpha = alpha;
  if (o.shake) ctx.translate((Math.random() - 0.5) * o.shake, (Math.random() - 0.5) * o.shake);

  // ground shadow
  if (o.shadow !== false) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.3;
    const sw = 34 * scale, sh = 9 * scale;
    const sg = ctx.createRadialGradient(x, y, 0, x, y, sw);
    sg.addColorStop(0, 'rgba(0,0,0,.75)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(x, y, sw, sh, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  const paint = (g) => {
    g.save();
    g.scale(scale * (back ? -1 : 1), scale);
    if (o.squash) g.transform(1 / o.squash, 0, 0, o.squash, 0, 0);
    g.translate(0, -46);
    drawAura(g, d, t, true);
    (LAYOUTS[d.body] || drawQuad)(g, d, t, back, out, rng, breathe, blink, mouthOpen);
    drawAura(g, d, t, false);
    g.restore();
  };

  if (o.flash > 0.01) {
    // Draw into an isolated buffer, tint it, then blit — keeps the flash on
    // the creature's own pixels.
    const box = Math.ceil(220 * scale) + 8;
    const g = getScratch(box);
    g.save();
    g.translate(box / 2, box * 0.72);
    paint(g);
    g.restore();
    g.save();
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = Math.min(1, o.flash);
    g.fillStyle = o.flashColor || '#fff';
    g.fillRect(0, 0, box, box);
    g.restore();
    ctx.drawImage(scratch, 0, 0, box, box, x - box / 2, y - box * 0.72, box, box);
  } else {
    ctx.translate(x, y);
    paint(ctx);
  }
  ctx.restore();
}

/** Compact portrait for menus / party lists — head-and-shoulders framing.
 *  `silhouette` blanks the creature out for catalogue entries not yet caught. */
function drawMonsterIcon(ctx, speciesId, x, y, size, t = 0, silhouette = false) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, size / 2, 0, 7); ctx.clip();
  const sp = getSpecies(speciesId);
  const g = ctx.createLinearGradient(x - size / 2, y - size / 2, x + size / 2, y + size / 2);
  const h = sp ? sp.design.pal[0][0] : 200;
  g.addColorStop(0, hsl(h, 40, 26)); g.addColorStop(1, hsl(h, 45, 14));
  ctx.fillStyle = g; ctx.fillRect(x - size, y - size, size * 2, size * 2);
  drawMonster(ctx, speciesId, x, y + size * 0.42, size * 1.15, {
    t, shadow: false,
    flash: silhouette ? 1 : 0, flashColor: '#0f1626',
  });
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, size / 2, 0, 7);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
}
  return { drawMonster, drawMonsterIcon };

  }

  get open() { return this.stack.length > 0; }
  get top() { return this.stack[this.stack.length - 1]; }

  openRoot() {
    this.stack = [{ id: 'root', cursor: 0 }];
    this.audio.sfx('select');
  }
  openShop() {
    this.stack = [{ id: 'shop', cursor: 0, qty: 1, mode: 'buy' }];
    this.audio.sfx('select');
  }
  openParty(onPick) {
    this.stack = [{ id: 'party', cursor: 0, onPick }];
  }
  push(s) { this.stack.push(s); this.audio.sfx('select'); }
  pop() { this.stack.pop(); this.audio.sfx('back'); }
  closeAll() { this.stack = []; }

  say(text) { this.toast = text; this.toastT = 2.2; }

  update(dt, input) {
    this.t += dt;
    if (this.toastT > 0) this.toastT -= dt;
    if (!this.open) return;
    const s = this.top;
    switch (s.id) {
      case 'root': return this.updateRoot(s, input);
      case 'party': return this.updateParty(s, input);
      case 'summary': return this.updateSummary(s, input);
      case 'bag': return this.updateBag(s, input);
      case 'dex': return this.updateDex(s, input);
      case 'card': return this.updateSimple(s, input);
      case 'save': return this.updateSave(s, input);
      case 'shop': return this.updateShop(s, input);
      default: return this.pop();
    }
  }

  nav(s, input, count, cols = 1) {
    const d = input.pressedDirection();
    if (!d || count === 0) return false;
    let n = s.cursor;
    if (cols === 1) {
      if (d === 'up') n--;
      if (d === 'down') n++;
    } else {
      if (d === 'up') n -= cols;
      if (d === 'down') n += cols;
      if (d === 'left') n += 1;
      if (d === 'right') n -= 1;
    }
    n = clamp(n, 0, count - 1);
    if (n !== s.cursor) { s.cursor = n; this.audio.sfx('cursor'); return true; }
    return false;
  }

  // ------------------------------------------------------------- root ----
  updateRoot(s, input) {
    this.nav(s, input, ROOT_ITEMS.length);
    if (input.pressed('b')) { this.closeAll(); this.audio.sfx('back'); return; }
    if (!input.pressed('a')) return;
    const pick = ROOT_ITEMS[s.cursor].id;
    if (pick === 'close') { this.closeAll(); this.audio.sfx('back'); return; }
    if (pick === 'party') this.push({ id: 'party', cursor: 0 });
    else if (pick === 'bag') this.push({ id: 'bag', cursor: 0 });
    else if (pick === 'dex') this.push({ id: 'dex', cursor: 0 });
    else if (pick === 'card') this.push({ id: 'card' });
    else if (pick === 'save') this.push({ id: 'save', cursor: 0 });
  }

  // ------------------------------------------------------------ party ----
  updateParty(s, input) {
    const party = this.state.party;
    this.nav(s, input, party.length, 2);
    if (input.pressed('b')) {
      if (s.onPick) { s.onPick(null); this.closeAll(); }
      else this.pop();
      return;
    }
    if (!input.pressed('a') || !party.length) return;
    if (s.onPick) { const cb = s.onPick; this.closeAll(); cb(s.cursor); return; }
    if (s.swapFrom != null) {
      const a = s.swapFrom, b = s.cursor;
      [party[a], party[b]] = [party[b], party[a]];
      s.swapFrom = null;
      this.audio.sfx('select');
      return;
    }
    this.push({ id: 'summary', cursor: 0, index: s.cursor, page: 0 });
  }

  // ---------------------------------------------------------- summary ----
  updateSummary(s, input) {
    const party = this.state.party;
    if (input.pressed('b')) return this.pop();
    const d = input.pressedDirection();
    if (d === 'up' && s.index > 0) { s.index--; this.audio.sfx('cursor'); }
    if (d === 'down' && s.index < party.length - 1) { s.index++; this.audio.sfx('cursor'); }
    if (input.pressed('a')) { s.page = (s.page + 1) % 2; this.audio.sfx('cursor'); }
  }

  updateSimple(s, input) { if (input.pressed('a') || input.pressed('b')) this.pop(); }

  // -------------------------------------------------------------- bag ----
  updateBag(s, input) {
    const items = this.state.itemList();
    this.nav(s, input, items.length);
    if (input.pressed('b')) return this.pop();
    if (!input.pressed('a') || !items.length) return;
    const it = items[s.cursor];
    const def = getItem(it.id);
    if (!def) return;
    if (def.kind === 'heal' || def.kind === 'cure' || def.kind === 'revive' || def.kind === 'pp') {
      this.push({
        id: 'party', cursor: 0,
        onPick: (idx) => {
          if (idx == null) return;
          this.useItemOn(it.id, this.state.party[idx]);
          this.stack = [{ id: 'root', cursor: 1 }, { id: 'bag', cursor: clamp(s.cursor, 0, 99) }];
        },
      });
    } else {
      this.audio.sfx('bump');
      this.say('אי אפשר להשתמש בזה כאן.');
    }
  }

  useItemOn(itemId, c) {
    const def = getItem(itemId);
    if (!c) return;
    if (def.kind === 'heal') {
      if (c.hp <= 0) { this.say(`${displayName(c)} מעולף — צריך פריט תחייה.`); this.audio.sfx('bump'); return; }
      if (c.hp >= c.stats.hp) { this.say(`${displayName(c)} כבר במלוא הכוח.`); this.audio.sfx('bump'); return; }
      const before = c.hp;
      c.hp = clamp(c.hp + def.hp, 0, c.stats.hp);
      if (def.cure === 'all') { c.status = 'none'; c.sleepTurns = 0; }
      this.state.removeItem(itemId, 1);
      this.audio.sfx('heal');
      this.say(`${displayName(c)} התאושש ב־${c.hp - before} נ"ח.`);
    } else if (def.kind === 'cure') {
      if (c.status !== def.cure) { this.say('לא הייתה לזה השפעה.'); this.audio.sfx('bump'); return; }
      c.status = 'none'; c.sleepTurns = 0;
      this.state.removeItem(itemId, 1);
      this.audio.sfx('heal');
      this.say(`${displayName(c)} החלים.`);
    } else if (def.kind === 'revive') {
      if (c.hp > 0) { this.say('לא הייתה לזה השפעה.'); this.audio.sfx('bump'); return; }
      c.hp = Math.max(1, Math.floor(c.stats.hp * def.ratio));
      this.state.removeItem(itemId, 1);
      this.audio.sfx('heal');
      this.say(`${displayName(c)} חזר להכרה!`);
    } else if (def.kind === 'pp') {
      const slot = c.moves.find((m) => m.pp < m.maxPp);
      if (!slot) { this.say('לא הייתה לזה השפעה.'); this.audio.sfx('bump'); return; }
      slot.pp = Math.min(slot.maxPp, slot.pp + def.pp);
      this.state.removeItem(itemId, 1);
      this.audio.sfx('heal');
      this.say(`${getMove(slot.id).name} התמלא.`);
    }
  }

  // -------------------------------------------------------------- dex ----
  updateDex(s, input) {
    const list = SPECIES_IDS.filter((id) => this.state.data.dex.seen[id]);
    this.nav(s, input, Math.max(1, list.length), 3);
    if (input.pressed('b')) return this.pop();
  }

  // ------------------------------------------------------------- save ----
  updateSave(s, input) {
    const d = input.pressedDirection();
    if (d === 'up' || d === 'down') { s.cursor = 1 - s.cursor; this.audio.sfx('cursor'); }
    if (input.pressed('b')) return this.pop();
    if (input.pressed('a')) {
      if (s.cursor === 0) {
        this.game.save();
        this.audio.sfx('levelup');
        this.say('המסע נשמר ביומן.');
        this.stack = [];
      } else this.pop();
    }
  }

  // ------------------------------------------------------------- shop ----
  updateShop(s, input) {
    const stock = SHOP_STOCK;
    if (s.buying) {
      const d = input.pressedDirection();
      const def = getItem(stock[s.cursor]);
      const maxQty = Math.max(1, Math.min(99, Math.floor(this.state.money / def.price) || 1));
      if (d === 'up') { s.qty = clamp(s.qty + 1, 1, maxQty); this.audio.sfx('cursor'); }
      if (d === 'down') { s.qty = clamp(s.qty - 1, 1, maxQty); this.audio.sfx('cursor'); }
      if (input.pressed('b')) { s.buying = false; this.audio.sfx('back'); return; }
      if (input.pressed('a')) {
        const cost = def.price * s.qty;
        if (cost > this.state.money) { this.audio.sfx('bump'); this.say('אין לך מספיק מטבעות.'); return; }
        this.state.addMoney(-cost);
        this.state.addItem(def.id, s.qty);
        this.audio.sfx('buy');
        this.say(`קנית ${def.name} ×${s.qty}.`);
        s.buying = false; s.qty = 1;
      }
      return;
    }
    this.nav(s, input, stock.length);
    if (input.pressed('b')) { this.closeAll(); this.audio.sfx('back'); return; }
    if (input.pressed('a')) { s.buying = true; s.qty = 1; this.audio.sfx('select'); }
  }

  // ------------------------------------------------------------- draw ----
  draw(ctx) {
    if (!this.open) { this.drawToast(ctx); return; }
    ctx.save();
    ctx.fillStyle = 'rgba(6,10,20,.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    for (let i = 0; i < this.stack.length; i++) {
      const s = this.stack[i];
      const isTop = i === this.stack.length - 1;
      if (!isTop) continue;
      switch (s.id) {
        case 'root': this.drawRoot(ctx, s, true); break;
        case 'party': this.drawParty(ctx, s); break;
        case 'summary': this.drawSummary(ctx, s); break;
        case 'bag': this.drawBag(ctx, s); break;
        case 'dex': this.drawDex(ctx, s); break;
        case 'card': this.drawCard(ctx, s); break;
        case 'save': this.drawSave(ctx, s); break;
        case 'shop': this.drawShop(ctx, s); break;
        default: break;
      }
    }
    this.drawToast(ctx);
  }

  drawToast(ctx) {
    if (this.toastT <= 0 || !this.toast) return;
    const w = measure(ctx, this.toast, 20) + 56;
    const a = clamp(this.toastT, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    panel(ctx, (W - w) / 2, 60, w, 52, { radius: 26 });
    drawText(ctx, this.toast, (W + w) / 2 - 28, 94, { size: 20 });
    ctx.restore();
  }

  drawRoot(ctx, s, isTop) {
    const w = 260, h = ROOT_ITEMS.length * 56 + 26;
    const x = W - w - 26, y = 26;
    panel(ctx, x, y, w, h, { radius: 16 });
    ROOT_ITEMS.forEach((it, i) => {
      const by = y + 14 + i * 56;
      if (isTop && i === s.cursor) selection(ctx, x + 12, by, w - 24, 48, this.t);
      drawText(ctx, it.label, x + w - 26, by + 32, { size: 22, color: isTop && i === s.cursor ? '#fff' : '#c8dcf5' });
    });
    // money strip
    panel(ctx, x, y + h + 12, w, 52, { radius: 14 });
    drawText(ctx, 'מטבעות', x + w - 22, y + h + 46, { size: 18, color: '#a8c4e8' });
    drawText(ctx, `${this.state.money}`, x + 24, y + h + 46, { size: 20, align: 'left', color: '#ffd97a' });
  }

  drawParty(ctx, s) {
    const x = 26, y = 26, w = 660, h = 588;
    panel(ctx, x, y, w, h, { radius: 18 });
    drawText(ctx, s.onPick ? 'בחר יצור' : 'הצוות שלך', x + w - 26, y + 44, { size: 26 });
    const party = this.state.party;
    if (!party.length) {
      drawText(ctx, 'אין לך עדיין יצורים.', x + w - 26, y + 100, { size: 20, color: '#9db4d4' });
      return;
    }
    party.forEach((c, i) => {
      const col = i % 2, row = (i / 2) | 0;
      const bx = x + 22 + (1 - col) * (w / 2 - 12);
      const by = y + 62 + row * 170;
      const bw = w / 2 - 34, bh = 158;
      if (i === s.cursor) selection(ctx, bx, by, bw, bh, this.t);
      panel(ctx, bx, by, bw, bh, {
        radius: 14, shadow: false,
        colors: c.hp > 0 ? ['rgba(30,44,72,.92)', 'rgba(16,24,42,.94)'] : ['rgba(64,30,36,.92)', 'rgba(32,16,20,.94)'],
      });
      drawMonsterIcon(ctx, c.species, bx + bw - 60, by + 60, 90, this.t + i);
      drawText(ctx, displayName(c), bx + bw - 118, by + 40,
        { size: fitSize(ctx, displayName(c), bw - 200, 21) });
      drawText(ctx, `Lv.${c.level}`, bx + 18, by + 40, { size: 18, align: 'left', color: '#a8c4e8' });
      const r = hpRatio(c);
      bar(ctx, bx + 18, by + 58, bw - 140, 12, r, { colors: hpColors(r) });
      drawNum(ctx, `${Math.max(0, c.hp)} / ${c.stats.hp}`, bx + bw - 118, by + 92, { size: 17, color: '#c8dcf5' });
      let cx = bx + bw - 118;
      for (const t of getSpecies(c.species).types) {
        cx -= chip(ctx, typeName(t), cx, by + 104, typeColor(t), { size: 11 }) + 6;
      }
      if (c.status !== 'none') chip(ctx, STATUS[c.status].name, bx + 96, by + 104, STATUS[c.status].color, { size: 11 });
      const e = expToNext(c);
      bar(ctx, bx + 18, by + 138, bw - 36, 7, e.into / e.span, { colors: ['#8fd8ff', '#3a7fc4'] });
    });
    // detail strip
    const c = party[s.cursor];
    if (c) {
      const dx = x + w + 16, dw = W - dx - 26;
      panel(ctx, dx, y, dw, h, { radius: 18 });
      ctx.save();
      ctx.beginPath(); ctx.roundRect(dx + 4, y + 4, dw - 8, 282, 16); ctx.clip();
      drawMonster(ctx, c.species, dx + dw / 2, y + 262, 165, { t: this.t });
      ctx.restore();
      drawText(ctx, displayName(c), dx + dw - 24, y + 300,
        { size: fitSize(ctx, displayName(c), dw - 48, 24) });
      wrapText(ctx, getSpecies(c.species).flavor, dw - 48, 15)
        .forEach((ln, i) => drawText(ctx, ln, dx + dw - 24, y + 336 + i * 22, { size: 15, color: '#9db4d4' }));
      c.moves.forEach((m, i) => {
        const mv = getMove(m.id);
        const my = y + 430 + i * 42;
        panel(ctx, dx + 16, my, dw - 32, 36, { radius: 10, shadow: false, colors: ['rgba(28,40,64,.9)', 'rgba(16,24,40,.9)'] });
        drawText(ctx, mv.name, dx + dw - 30, my + 25, { size: 17 });
        drawNum(ctx, `${m.pp}/${m.maxPp}`, dx + 30, my + 25, { size: 15, align: 'left', color: '#a8c4e8' });
      });
    }
  }

  drawSummary(ctx, s) {
    const c = this.state.party[s.index];
    if (!c) return;
    const sp = getSpecies(c.species);
    panel(ctx, 26, 26, W - 52, H - 52, { radius: 18 });
    drawMonster(ctx, c.species, 220, 330, 320, { t: this.t });
    drawText(ctx, displayName(c), W - 60, 90, { size: 32 });
    drawText(ctx, `#${String(sp.dex).padStart(3, '0')}  ${sp.en}`, W - 60, 124, { size: 17, color: '#9db4d4' });
    let cx = W - 60;
    for (const t of sp.types) cx -= chip(ctx, typeName(t), cx, 140, typeColor(t), { size: 13 }) + 8;

    if (s.page === 0) {
      const stats = [
        ['נ"ח', 'hp'], ['התקפה', 'atk'], ['הגנה', 'def'],
        ['התקפה מיוחדת', 'spa'], ['הגנה מיוחדת', 'spd'], ['מהירות', 'spe'],
      ];
      stats.forEach(([label, key], i) => {
        const y = 220 + i * 48;
        drawText(ctx, label, W - 60, y, { size: 18, color: '#c8dcf5' });
        drawNum(ctx, `${c.stats[key]}`, 752, y, { size: 18, color: '#fff' });
        bar(ctx, 440, y - 15, 240, 14, clamp(c.stats[key] / 200, 0, 1), {
          colors: ['#8fd8ff', '#3a7fc4'],
        });
      });
      const e = expToNext(c);
      drawText(ctx, `רמה ${c.level}`, W - 60, 176, { size: 20, color: '#ffd97a' });
      drawText(ctx, `ניסיון לרמה הבאה: ${Math.max(0, e.next - c.exp)}`, 720, 176, { size: 16, color: '#9db4d4' });
      drawText(ctx, 'התקדמות לרמה הבאה', W - 60, 506, { size: 15, color: '#7f9dc4' });
      bar(ctx, 440, 520, 400, 12, e.into / e.span, { colors: ['#8fd8ff', '#3a7fc4'] });
      drawText(ctx, 'A — מהלכים · B — חזרה', W - 60, 570, { size: 15, color: '#7f9dc4' });
    } else {
      c.moves.forEach((m, i) => {
        const mv = getMove(m.id);
        const y = 200 + i * 84;
        panel(ctx, 450, y, 460, 72, { radius: 12, shadow: false, colors: ['rgba(28,40,64,.9)', 'rgba(16,24,40,.9)'] });
        drawText(ctx, mv.name, 890, y + 30, { size: 21 });
        chip(ctx, typeName(mv.type), 700, y + 12, typeColor(mv.type), { size: 12 });
        drawNum(ctx, `${m.pp}/${m.maxPp}`, 470, y + 30, { size: 16, align: 'left', color: '#a8c4e8' });
        drawText(ctx, `${mv.cat === 'physical' ? 'פיזי' : mv.cat === 'special' ? 'מיוחד' : 'סטטוס'} · דיוק ${mv.acc ?? '∞'} · עוצמה ${mv.power || '—'}`,
          890, y + 58, { size: 15, color: '#9db4d4' });
      });
      drawText(ctx, 'A — נתונים · B — חזרה', W - 60, 570, { size: 15, color: '#7f9dc4' });
    }
  }

  drawBag(ctx, s) {
    panel(ctx, 26, 26, W - 52, H - 52, { radius: 18 });
    drawText(ctx, 'תיק', W - 60, 80, { size: 28 });
    drawText(ctx, `${this.state.money} מטבעות`, 60, 80, { size: 20, align: 'left', color: '#ffd97a' });
    const items = this.state.itemList();
    if (!items.length) {
      drawText(ctx, 'התיק ריק.', W - 60, 160, { size: 20, color: '#9db4d4' });
      return;
    }
    const perPage = 9;
    const start = clamp(s.cursor - 4, 0, Math.max(0, items.length - perPage));
    for (let i = 0; i < Math.min(perPage, items.length - start); i++) {
      const idx = start + i;
      const it = items[idx];
      const def = getItem(it.id);
      const y = 130 + i * 46;
      if (idx === s.cursor) selection(ctx, 50, y - 30, W - 100, 40, this.t);
      ctx.save(); ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.roundRect(W - 96, y - 24, 26, 26, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      drawText(ctx, def.name, W - 110, y, { size: 20 });
      drawText(ctx, `×${it.count}`, 70, y, { size: 18, align: 'left', color: '#a8c4e8' });
    }
    const cur = items[clamp(s.cursor, 0, items.length - 1)];
    if (cur) {
      panel(ctx, 50, H - 130, W - 100, 76, { radius: 12, shadow: false, colors: ['rgba(28,40,64,.9)', 'rgba(16,24,40,.9)'] });
      drawText(ctx, getItem(cur.id).desc, W - 74, H - 86, { size: 18, color: '#c8dcf5' });
    }
  }

  drawDex(ctx, s) {
    panel(ctx, 26, 26, W - 52, H - 52, { radius: 18 });
    drawText(ctx, 'קטלוג היצורים', W - 60, 78, { size: 28 });
    drawText(ctx, `נצפו ${this.state.seenCount} · נלכדו ${this.state.caughtCount} מתוך ${SPECIES_IDS.length}`,
      60, 78, { size: 17, align: 'left', color: '#9db4d4' });
    const list = SPECIES_IDS.filter((id) => this.state.data.dex.seen[id]);
    if (!list.length) {
      drawText(ctx, 'עוד לא פגשת אף יצור.', W - 60, 160, { size: 20, color: '#9db4d4' });
      return;
    }
    const cols = 3, rows = 4, perPage = cols * rows;
    const page = Math.floor(s.cursor / perPage);
    for (let i = 0; i < perPage; i++) {
      const idx = page * perPage + i;
      if (idx >= list.length) break;
      const id = list[idx];
      const sp = SPECIES[id];
      const col = i % cols, row = (i / cols) | 0;
      const bw = 268, bh = 104;
      const bx = W - 60 - (col + 1) * (bw + 14) + 14;
      const by = 110 + row * (bh + 12);
      if (idx === s.cursor) selection(ctx, bx, by, bw, bh, this.t);
      panel(ctx, bx, by, bw, bh, { radius: 12, shadow: false, colors: ['rgba(28,40,64,.9)', 'rgba(16,24,40,.9)'] });
      const caught = this.state.data.dex.caught[id];
      drawMonsterIcon(ctx, id, bx + bw - 52, by + 52, 76, caught ? this.t + idx : 0, !caught);
      drawText(ctx, `#${String(sp.dex).padStart(3, '0')}`, bx + 16, by + 34, { size: 15, align: 'left', color: '#7f9dc4' });
      drawText(ctx, sp.name, bx + bw - 106, by + 40, { size: 19, color: caught ? '#fff' : '#93a6c2' });
      let cx = bx + bw - 106;
      for (const t of sp.types) cx -= chip(ctx, typeName(t), cx, by + 54, typeColor(t), { size: 10 }) + 5;
      if (caught) drawText(ctx, '●', bx + 16, by + 62, { size: 16, align: 'left', color: '#8ef0b4' });
    }
    drawText(ctx, `עמוד ${page + 1}/${Math.ceil(list.length / perPage)}`, W / 2, H - 66, { size: 16, color: '#7f9dc4' });
  }

  drawCard(ctx) {
    const d = this.state.data;
    panel(ctx, 140, 90, 680, 460, { radius: 22 });
    drawText(ctx, 'כרטיס מאמן', 780, 154, { size: 28 });
    drawActor(ctx, d.player.look, 260, 400, 'down', 0, 3.2);
    const rows = [
      ['שם', d.player.name],
      ['מטבעות', `${d.money}`],
      ['יצורים בצוות', `${d.party.length}`],
      ['נלכדו', `${this.state.caughtCount}`],
      ['נצפו', `${this.state.seenCount}`],
      ['צעדים', `${d.steps}`],
      ['זמן משחק', formatTime(d.playtime)],
    ];
    rows.forEach(([k, v], i) => {
      const y = 210 + i * 44;
      drawText(ctx, k, 780, y, { size: 19, color: '#a8c4e8' });

  }
  for (let i = 0; i < pebbles; i++) {
    const x = rng() * TILE, y = rng() * TILE, r = 0.8 + rng() * 2.2;
    ctx.fillStyle = hsl(h, s * 0.7, l + (rng() > 0.5 ? 14 : -16), 0.7);
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.75, rng() * 3, 0, 7); ctx.fill();
  }
}

function paintRock(ctx, rng, noise, ox, oy, base) {
  paintDirt(ctx, rng, noise, ox, oy, base, 10);
  ctx.strokeStyle = hsl(base[0], base[1], base[2] - 18, 0.55);
  ctx.lineWidth = 1.3;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    let x = rng() * TILE, y = rng() * TILE;
    ctx.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += (rng() - 0.5) * 22; y += (rng() - 0.5) * 22; ctx.lineTo(x, y); }
    ctx.stroke();
  }
}

function paintPlanks(ctx, rng, base, horizontal = true) {
  const [h, s, l] = base;
  const pw = 16;
  for (let i = 0; i < TILE / pw; i++) {
    const shade = (rng() - 0.5) * 8;
    ctx.fillStyle = hsl(h, s, clamp(l + shade, 6, 80));
    if (horizontal) ctx.fillRect(0, i * pw, TILE, pw);
    else ctx.fillRect(i * pw, 0, pw, TILE);
    ctx.strokeStyle = hsl(h, s, l - 18, 0.8);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    if (horizontal) { ctx.moveTo(0, i * pw); ctx.lineTo(TILE, i * pw); }
    else { ctx.moveTo(i * pw, 0); ctx.lineTo(i * pw, TILE); }
    ctx.stroke();
  }
  ctx.strokeStyle = hsl(h, s * 0.8, l - 8, 0.35);
  ctx.lineWidth = 1;
  for (let i = 0; i < 10; i++) {
    const y = rng() * TILE;
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.bezierCurveTo(TILE * 0.3, y + (rng() - 0.5) * 4, TILE * 0.7, y + (rng() - 0.5) * 4, TILE, y);
    ctx.stroke();
  }
}

function paintTileFloor(ctx, rng, base) {
  const [h, s, l] = base;
  const half = TILE / 2;
  for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
    ctx.fillStyle = hsl(h, s, l + ((i + j) % 2 ? -6 : 2) + (rng() - 0.5) * 3);
    ctx.fillRect(i * half, j * half, half, half);
    const g = ctx.createLinearGradient(i * half, j * half, i * half + half, j * half + half);
    g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(0,0,0,.10)');
    ctx.fillStyle = g; ctx.fillRect(i * half, j * half, half, half);
  }
  ctx.strokeStyle = hsl(h, s, l - 22, 0.6); ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, TILE, TILE);
  ctx.beginPath(); ctx.moveTo(half, 0); ctx.lineTo(half, TILE); ctx.moveTo(0, half); ctx.lineTo(TILE, half); ctx.stroke();
}

function paintCarpet(ctx, rng, base) {
  const [h, s, l] = base;
  ctx.fillStyle = hsl(h, s, l); ctx.fillRect(0, 0, TILE, TILE);
  ctx.strokeStyle = hsl(h, s, l + 8, 0.3); ctx.lineWidth = 1;
  for (let i = 0; i < TILE; i += 4) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, TILE); ctx.stroke();
  }
  ctx.strokeStyle = hsl(h, s, l - 10, 0.28);
  for (let i = 0; i < TILE; i += 4) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(TILE, i); ctx.stroke();
  }
}

function paintWater(ctx, noise, phase, base) {
  const [h, s, l] = base;
  // Flat base: any per-tile gradient would make each tile of a pond readable
  // as its own square.  All the life comes from the caustics below.
  ctx.fillStyle = hsl(h, s, l); ctx.fillRect(0, 0, TILE, TILE);
  // slow, low-contrast caustics; sampled coarsely and drawn soft so the
  // 16-frame loop does not read as a repeating stamp
  ctx.globalCompositeOperation = 'lighter';
  const drift = phase * 6.28;
  for (let y = 0; y < TILE; y += 2) {
    for (let x = 0; x < TILE; x += 2) {
      const n = fbm(noise, x / 26 + Math.cos(drift) * 0.35, y / 26 + Math.sin(drift) * 0.35, 3);
      const c = Math.pow(clamp((n - 0.55) * 3.2, 0, 1), 2.2);
      if (c > 0.02) {
        ctx.fillStyle = hsl(h - 16, 55, 82, c * 0.28);
        ctx.fillRect(x, y, 2, 2);
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ------------------------------------------------------------ decorations --
function makeDeco(w, h, draw) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  draw(ctx);
  return c;
}

function tree(rng, big) {
  const w = big ? TILE * 1.5 : TILE * 1.15;
  const h = big ? TILE * 2.1 : TILE * 1.6;
  return makeDeco(w, h, (ctx) => {
    const cx = w / 2;
    const trunkH = h * (big ? 0.3 : 0.28);
    const hue = 104 + (rng() - 0.5) * 22;
    const sat = 42 + rng() * 14;
    // trunk
    const tg = ctx.createLinearGradient(cx - 9, 0, cx + 9, 0);
    tg.addColorStop(0, hsl(26, 40, 26)); tg.addColorStop(0.4, hsl(28, 42, 36)); tg.addColorStop(1, hsl(26, 40, 22));
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(cx - 8, h);
    ctx.quadraticCurveTo(cx - 6, h - trunkH * 0.6, cx - 5, h - trunkH);
    ctx.lineTo(cx + 5, h - trunkH);
    ctx.quadraticCurveTo(cx + 6, h - trunkH * 0.6, cx + 8, h);
    ctx.closePath(); ctx.fill();
    // canopy: overlapping blobs, dark -> light
    const blobs = big ? 8 : 6;
    const cy = h - trunkH - h * 0.26;
    for (let pass = 0; pass < 3; pass++) {
      const l = 22 + pass * 10;
      const shrink = 1 - pass * 0.16;
      const off = -pass * h * 0.035;
      for (let i = 0; i < blobs; i++) {
        const a = (i / blobs) * Math.PI * 2 + rng() * 0.2;
        const rr = (w * 0.3) * (0.65 + rng() * 0.45) * shrink;
        const px = cx + Math.cos(a) * w * 0.22 * shrink;
        const py = cy + Math.sin(a) * h * 0.13 * shrink + off;
        ctx.fillStyle = hsl(hue + (rng() - 0.5) * 12, sat, l + rng() * 6);
        ctx.beginPath(); ctx.ellipse(px, py, rr, rr * 0.9, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = hsl(hue, sat, l + 3);
      ctx.beginPath(); ctx.ellipse(cx, cy + off, w * 0.36 * shrink, h * 0.23 * shrink, 0, 0, 7); ctx.fill();
    }
    // rim light top-left
    ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(cx - w * 0.18, cy - h * 0.14, 2, cx - w * 0.18, cy - h * 0.14, w * 0.42);
    rg.addColorStop(0, 'rgba(200,255,170,.28)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
  });
}

function boulder(rng) {
  const w = TILE, h = TILE * 0.95;
  return makeDeco(w, h, (ctx) => {
    const cx = w / 2, cy = h * 0.62;
    ctx.beginPath();
    const pts = 9;
    for (let i = 0; i < pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const r = (0.72 + rng() * 0.24) * w * 0.42;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.78;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - w * 0.3, cy - h * 0.3, cx + w * 0.3, cy + h * 0.3);
    g.addColorStop(0, hsl(30, 12, 62)); g.addColorStop(0.55, hsl(28, 12, 46)); g.addColorStop(1, hsl(26, 14, 30));
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = hsl(26, 16, 22); ctx.stroke();
    ctx.strokeStyle = hsl(28, 10, 70, .35); ctx.lineWidth = 1.4;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + (rng() - 0.5) * w * 0.4, cy - h * 0.25);
      ctx.lineTo(cx + (rng() - 0.5) * w * 0.5, cy + h * 0.2);
      ctx.stroke();
    }
  });
}

/** Bottom edge of a rock wall: a shaded front face with a narrow lit lip on
 *  top, plus a contact shadow so the wall sits on the ground. */
function cliff(rng) {
  const w = TILE, h = TILE * 1.35;
  return makeDeco(w, h, (ctx) => {
    const faceTop = h - TILE * 1.02;
    const fg = ctx.createLinearGradient(0, faceTop, 0, h);
    fg.addColorStop(0, hsl(26, 13, 30));
    fg.addColorStop(0.55, hsl(24, 14, 23));
    fg.addColorStop(1, hsl(22, 16, 15));
    ctx.fillStyle = fg; ctx.fillRect(0, faceTop, w, TILE * 1.02);
    // lit lip
    const tg = ctx.createLinearGradient(0, faceTop - TILE * 0.3, 0, faceTop + 4);
    tg.addColorStop(0, hsl(30, 15, 44)); tg.addColorStop(1, hsl(28, 14, 33));
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(0, faceTop + 3);
    ctx.lineTo(w * 0.1, faceTop - TILE * 0.3);
    ctx.lineTo(w, faceTop - TILE * 0.26);
    ctx.lineTo(w, faceTop + 3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = hsl(30, 12, 52, .5); ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w * 0.1, faceTop - TILE * 0.29); ctx.lineTo(w, faceTop - TILE * 0.25);
    ctx.stroke();
    // cracks in the face
    ctx.strokeStyle = hsl(22, 16, 11, .55); ctx.lineWidth = 1.8;
    for (let i = 0; i < 4; i++) {
      const x = rng() * w;
      ctx.beginPath(); ctx.moveTo(x, faceTop + 6);
      ctx.lineTo(x + (rng() - 0.5) * 12, h - 6); ctx.stroke();
    }
    // contact shadow
    const sg = ctx.createLinearGradient(0, h - 12, 0, h);
    sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = sg; ctx.fillRect(0, h - 12, w, 12);
  });
}

/** Interior of a rock wall: a flat, tile-sized block.  Only the bottom tile of
 *  a wall run gets the lit top face from cliff(), which is what makes a field
 *  of '^' read as a wall instead of a staircase. */
function cliffBody(rng) {
  return makeDeco(TILE, TILE, (ctx) => {
    const g = ctx.createLinearGradient(0, 0, TILE * 0.4, TILE);
    g.addColorStop(0, hsl(26, 12, 30));
    g.addColorStop(0.6, hsl(24, 13, 24));
    g.addColorStop(1, hsl(22, 14, 19));
    ctx.fillStyle = g; ctx.fillRect(0, 0, TILE, TILE);
    ctx.strokeStyle = hsl(24, 14, 15, .55); ctx.lineWidth = 1.6;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      let x = rng() * TILE, y = rng() * TILE;
      ctx.moveTo(x, y);
      for (let k = 0; k < 3; k++) { x += (rng() - 0.5) * 26; y += (rng() - 0.5) * 26; ctx.lineTo(x, y); }
      ctx.stroke();
    }
    ctx.fillStyle = hsl(28, 12, 40, .18);
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.ellipse(rng() * TILE, rng() * TILE, 3 + rng() * 7, 2 + rng() * 5, rng() * 3, 0, 7);
      ctx.fill();
    }
  });
}

function fence() {
  const w = TILE, h = TILE * 0.9;
  return makeDeco(w, h, (ctx) => {
    ctx.fillStyle = hsl(30, 30, 44);
    ctx.strokeStyle = hsl(28, 32, 24); ctx.lineWidth = 2;
    ctx.fillRect(0, h * 0.35, w, 7); ctx.strokeRect(0, h * 0.35, w, 7);
    ctx.fillRect(0, h * 0.65, w, 7); ctx.strokeRect(0, h * 0.65, w, 7);
    for (const x of [w * 0.12, w * 0.62]) {
      ctx.fillRect(x, h * 0.12, 10, h * 0.85);
      ctx.strokeRect(x, h * 0.12, 10, h * 0.85);
    }
  });
}

function sign() {
  const w = TILE, h = TILE * 1.05;
  return makeDeco(w, h, (ctx) => {
    ctx.fillStyle = hsl(28, 34, 32); ctx.fillRect(w * 0.44, h * 0.5, 8, h * 0.5);
    const g = ctx.createLinearGradient(0, h * 0.12, 0, h * 0.6);
    g.addColorStop(0, hsl(32, 44, 54)); g.addColorStop(1, hsl(30, 40, 38));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(w * 0.1, h * 0.1, w * 0.8, h * 0.45, 6); ctx.fill();
    ctx.lineWidth = 2.4; ctx.strokeStyle = hsl(28, 36, 22); ctx.stroke();
    ctx.strokeStyle = hsl(30, 30, 70, .6); ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(w * 0.2, h * (0.2 + i * 0.09)); ctx.lineTo(w * 0.8, h * (0.2 + i * 0.09));
      ctx.stroke();
    }
  });
}

function flower(rng) {
  const w = TILE, h = TILE;
  return makeDeco(w, h, (ctx) => {
    for (let k = 0; k < 3; k++) {
      const cx = 14 + rng() * (w - 28), cy = 22 + rng() * (h - 34);
      const hue = [348, 44, 288, 200][Math.floor(rng() * 4)];
      ctx.strokeStyle = hsl(110, 45, 32); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy + 10); ctx.lineTo(cx, cy); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * 6.28;
        ctx.fillStyle = hsl(hue, 72, 66);
        ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * 4, cy + Math.sin(a) * 4, 3.4, 2.6, a, 0, 7); ctx.fill();
      }
      ctx.fillStyle = hsl(48, 90, 72);
      ctx.beginPath(); ctx.arc(cx, cy, 2.2, 0, 7); ctx.fill();
    }
  });
}

function bush(rng) {
  const w = TILE, h = TILE * 0.85;
  return makeDeco(w, h, (ctx) => {
    for (let i = 0; i < 5; i++) {
      const x = w * 0.5 + (rng() - 0.5) * w * 0.5;
      const y = h * 0.65 + (rng() - 0.5) * h * 0.3;
      ctx.fillStyle = hsl(108 + rng() * 16, 46, 26 + rng() * 12);
      ctx.beginPath(); ctx.ellipse(x, y, w * 0.24, h * 0.26, 0, 0, 7); ctx.fill();
    }
  });
}

function tallGrassFrame(rng, phase) {
  const w = TILE, h = TILE * 1.2;
  return makeDeco(w, h, (ctx) => {
    for (let i = 0; i < 40; i++) {
      const x = rng() * w;
      const bh = h * (0.45 + rng() * 0.5);
      const sway = Math.sin(phase * 6.28 + x * 0.12) * 5;
      const hue = 100 + rng() * 26;
      ctx.strokeStyle = hsl(hue, 50, 24 + rng() * 20);
      ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, h);
      ctx.quadraticCurveTo(x + sway * 0.4, h - bh * 0.55, x + sway, h - bh);
      ctx.stroke();
    }
  });
}

function counter() {
  return makeDeco(TILE, TILE, (ctx) => {
    const g = ctx.createLinearGradient(0, 0, 0, TILE);
    g.addColorStop(0, hsl(200, 22, 78)); g.addColorStop(0.25, hsl(200, 20, 66)); g.addColorStop(1, hsl(205, 22, 40));
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(0, TILE * 0.12, TILE, TILE * 0.88, 5); ctx.fill();
    ctx.strokeStyle = hsl(205, 24, 28); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, TILE * 0.12, TILE, 5);
  });
}

function shelf() {
  return makeDeco(TILE, TILE * 1.2, (ctx) => {
    const h = TILE * 1.2;
    ctx.fillStyle = hsl(28, 34, 30); ctx.fillRect(2, h - TILE * 1.1, TILE - 4, TILE * 1.1);
    ctx.strokeStyle = hsl(26, 32, 18); ctx.lineWidth = 2; ctx.strokeRect(2, h - TILE * 1.1, TILE - 4, TILE * 1.1);
    for (let r = 0; r < 3; r++) {
      const y = h - TILE * 1.0 + r * TILE * 0.32;
      ctx.fillStyle = hsl(26, 30, 20); ctx.fillRect(4, y + TILE * 0.26, TILE - 8, 4);
      for (let b = 0; b < 5; b++) {
        ctx.fillStyle = hsl((b * 67 + r * 33) % 360, 55, 52);
        ctx.fillRect(7 + b * 10, y + 4, 7, TILE * 0.22);
      }
    }
  });
}

function machine() {
  return makeDeco(TILE, TILE * 1.15, (ctx) => {
    const h = TILE * 1.15;
    const g = ctx.createLinearGradient(0, h - TILE, 0, h);
    g.addColorStop(0, hsl(200, 18, 86)); g.addColorStop(1, hsl(205, 20, 58));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(4, h - TILE * 1.05, TILE - 8, TILE * 1.05, 8); ctx.fill();
    ctx.strokeStyle = hsl(205, 22, 34); ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = hsl(160, 60, 46);
    ctx.beginPath(); ctx.roundRect(12, h - TILE * 0.92, TILE - 24, TILE * 0.34, 4); ctx.fill();
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = ['#f05a5a', '#f0c25a', '#5af0a0'][i];
      ctx.beginPath(); ctx.arc(18 + i * 14, h - TILE * 0.34, 4.5, 0, 7); ctx.fill();
    }
  });
}

function pcDesk() {
  return makeDeco(TILE, TILE * 1.1, (ctx) => {
    const h = TILE * 1.1;
    ctx.fillStyle = hsl(28, 30, 34); ctx.fillRect(4, h - TILE * 0.5, TILE - 8, TILE * 0.5);
    ctx.fillStyle = hsl(210, 16, 30);
    ctx.beginPath(); ctx.roundRect(10, h - TILE * 0.98, TILE - 20, TILE * 0.5, 5); ctx.fill();
    ctx.fillStyle = hsl(190, 70, 52);
    ctx.fillRect(15, h - TILE * 0.92, TILE - 30, TILE * 0.36);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(15, h - TILE * 0.92, TILE - 30, 6);
  });
}

function crate() {
  return makeDeco(TILE, TILE, (ctx) => {
    const g = ctx.createLinearGradient(0, 0, TILE, TILE);
    g.addColorStop(0, hsl(32, 42, 48)); g.addColorStop(1, hsl(28, 40, 30));
    ctx.fillStyle = g; ctx.fillRect(4, 6, TILE - 8, TILE - 10);
    ctx.strokeStyle = hsl(28, 40, 20); ctx.lineWidth = 2.4;
    ctx.strokeRect(4, 6, TILE - 8, TILE - 10);
    ctx.beginPath();
    ctx.moveTo(4, 6); ctx.lineTo(TILE - 4, TILE - 4);
    ctx.moveTo(TILE - 4, 6); ctx.lineTo(4, TILE - 4);
    ctx.stroke();
  });
}

function wallBlock() {
  return makeDeco(TILE, TILE, (ctx) => {
    ctx.fillStyle = hsl(220, 12, 40); ctx.fillRect(0, 0, TILE, TILE);
    ctx.strokeStyle = hsl(220, 12, 26); ctx.lineWidth = 2;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 2; c++) {
        ctx.strokeRect((c * TILE) / 2 + (r % 2 ? TILE / 4 : 0) - TILE / 4, (r * TILE) / 4, TILE / 2, TILE / 4);
      }
    }
  });
}

// ------------------------------------------------------------------ boot --
function buildTerrainArt() {
  const noise = valueNoise2D(1337);
  for (const [name, m] of Object.entries(MATERIALS)) {
    ART.ground[name] = [];
    for (let v = 0; v < VARIANTS; v++) {
      const c = makeCanvas(TILE, TILE);
      const ctx = c.getContext('2d');
      const rng = makeRng(0xabc + v * 977 + name.length * 31);
      const ox = v * 197 + 31, oy = v * 149 + 17;
      switch (name) {
        case 'grass': paintGrass(ctx, rng, noise, ox, oy, m.base); break;
        case 'path': paintDirt(ctx, rng, noise, ox, oy, m.base, 20); break;
        case 'sand': paintDirt(ctx, rng, noise, ox, oy, m.base, 26); break;
        case 'rock': paintRock(ctx, rng, noise, ox, oy, m.base); break;
        case 'wood': paintPlanks(ctx, rng, m.base, true); break;
        case 'bridge': paintPlanks(ctx, rng, m.base, false); break;
        case 'tilefloor': paintTileFloor(ctx, rng, m.base); break;
        case 'carpet': paintCarpet(ctx, rng, m.base); break;
        case 'shallow':
          paintDirt(ctx, rng, noise, ox, oy, MATERIALS.sand.base, 12);
          ctx.fillStyle = hsl(192, 62, 58, 0.55); ctx.fillRect(0, 0, TILE, TILE);
          break;
        case 'void':
          ctx.fillStyle = hsl(230, 22, 7); ctx.fillRect(0, 0, TILE, TILE); break;
        default:
          ctx.fillStyle = m.avg; ctx.fillRect(0, 0, TILE, TILE);
      }
      ART.ground[name].push(c);
    }
  }
  // animated water
  for (let f = 0; f < WATER_FRAMES; f++) {
    const c = makeCanvas(TILE, TILE);
    paintWater(c.getContext('2d'), noise, f / WATER_FRAMES, MATERIALS.water.base);
    ART.water.push(c);
  }
  ART.ground.water = ART.water;

  const rng = makeRng(20260909);
  ART.deco.tree = [tree(rng), tree(rng), tree(rng)];
  ART.deco.bigtree = [tree(rng, true), tree(rng, true)];
  ART.deco.boulder = [boulder(rng), boulder(rng)];
  ART.deco.cliff = [cliff(rng), cliff(rng)];
  ART.deco.cliffbody = [cliffBody(rng), cliffBody(rng), cliffBody(rng)];
  ART.deco.fence = [fence()];
  ART.deco.sign = [sign()];
  ART.deco.flower = [flower(rng), flower(rng)];
  ART.deco.bush = [bush(rng), bush(rng)];

const STAT_KEYS = ['atk', 'def', 'spa', 'spd', 'spe', 'acc', 'eva'];
const STAT_LABEL = {
  atk: 'ההתקפה', def: 'ההגנה', spa: 'ההתקפה המיוחדת',
  spd: 'ההגנה המיוחדת', spe: 'המהירות', acc: 'הדיוק', eva: 'ההתחמקות',
};

const freshStages = () => ({ atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0, eva: 0 });
const freshVolatile = () => ({ confusion: 0, flinch: false, recharge: false });

function stageMul(n) { return n >= 0 ? (2 + n) / 2 : 2 / (2 - n); }
function accMul(n) { return n >= 0 ? (3 + n) / 3 : 3 / (3 - n); }

class Battle {
  /**
   * @param o.party      the player's party array (mutated: hp, exp, levels)
   * @param o.foeParty   array of creatures for a trainer battle, or one wild
   * @param o.kind       'wild' | 'trainer'
   * @param o.trainer    { name, intro, defeat, reward, look }
   */
  constructor(o) {
    this.party = o.party;
    this.foeParty = o.foeParty;
    this.kind = o.kind;
    this.trainer = o.trainer || null;
    this.state = o.state;
    this.canRun = o.kind === 'wild';

    this.pIndex = this.party.findIndex((c) => c.hp > 0);
    this.fIndex = 0;
    this.stages = { player: freshStages(), foe: freshStages() };
    this.volatile = { player: freshVolatile(), foe: freshVolatile() };
    this.runAttempts = 0;
    this.participants = new Set();
    this.over = false;
    this.result = null;
    this.turn = 0;
  }

  get me() { return this.party[this.pIndex]; }
  get foe() { return this.foeParty[this.fIndex]; }
  actor(side) { return side === 'player' ? this.me : this.foe; }
  other(side) { return side === 'player' ? 'foe' : 'player'; }

  markParticipant() { if (this.me) this.participants.add(this.me.uid); }

  // ------------------------------------------------------------ helpers --
  effStat(side, key) {
    const c = this.actor(side);
    let v = c.stats[key] * stageMul(this.stages[side][key]);
    if (key === 'atk' && c.status === 'burn') v *= 0.5;
    if (key === 'spe' && c.status === 'para') v *= 0.5;
    return Math.max(1, Math.floor(v));
  }

  applyStage(side, key, delta, ev) {
    const s = this.stages[side];
    const before = s[key];
    s[key] = clamp(before + delta, -6, 6);
    const name = displayName(this.actor(side));
    const who = side === 'player' ? name : `${name} של היריב`;
    if (s[key] === before) {
      ev.push({ t: 'msg', text: `${STAT_LABEL[key]} של ${who} כבר לא ${delta > 0 ? 'יכולה לעלות' : 'יכולה לרדת'} יותר!` });
      return;
    }
    const word = delta > 0
      ? (delta >= 2 ? 'עלתה בחדות' : 'עלתה')
      : (delta <= -2 ? 'ירדה בחדות' : 'ירדה');
    ev.push({ t: 'stat', side, up: delta > 0 });
    ev.push({ t: 'msg', text: `${STAT_LABEL[key]} של ${who} ${word}!` });
  }

  setStatus(side, status, ev, force = false) {
    const c = this.actor(side);
    if (c.status !== 'none' && !force) return false;
    const sp = getSpecies(c.species);
    // simple immunity: a type resists its own affliction
    const immune = {
      burn: 'ember', freeze: 'frost', para: 'volt', poison: 'toxic',
    }[status];
    if (immune && sp.types.includes(immune)) return false;
    c.status = status;
    if (status === 'sleep') c.sleepTurns = rangeInt(1, 3);
    ev.push({ t: 'status', side, status });
    const name = displayName(c);
    const msg = {
      burn: `${name} נכווה!`, poison: `${name} הורעל!`, para: `${name} שותק!`,
      sleep: `${name} נרדם!`, freeze: `${name} קפא!`,
    }[status];
    ev.push({ t: 'msg', text: msg });
    return true;
  }

  damage(side, amount, ev, opts = {}) {
    const c = this.actor(side);
    const from = c.hp;
    c.hp = clamp(c.hp - Math.max(0, Math.floor(amount)), 0, c.stats.hp);
    ev.push({ t: 'hp', side, from, to: c.hp, max: c.stats.hp, ...opts });
    return from - c.hp;
  }

  heal(side, amount, ev) {
    const c = this.actor(side);
    const from = c.hp;
    c.hp = clamp(c.hp + Math.floor(amount), 0, c.stats.hp);
    if (c.hp !== from) ev.push({ t: 'hp', side, from, to: c.hp, max: c.stats.hp, heal: true });
    return c.hp - from;
  }

  // ------------------------------------------------------- damage maths --
  computeDamage(side, move) {
    const att = this.actor(side);
    const def = this.actor(this.other(side));
    const defTypes = getSpecies(def.species).types;
    const eff = move.ignoreType ? 1 : typeMultiplier(move.type, defTypes);
    if (eff === 0) return { dmg: 0, eff, crit: false };

    const eff2 = move.ignoreType ? 1 : eff;
    const physical = move.cat === 'physical';
    const A = this.effStat(side, physical ? 'atk' : 'spa');
    const D = this.effStat(this.other(side), physical ? 'def' : 'spd');
    let power = move.power;
    if (move.eff?.doubleIfStatus && def.status !== 'none') power *= 2;

    const critRate = 1 / (move.eff?.critBoost ? 8 : 24);
    const crit = chance(critRate);

    let dmg = Math.floor(Math.floor(Math.floor((2 * att.level) / 5 + 2) * power * A / D) / 50) + 2;
    if (crit) dmg *= 2;
    const stab = !move.ignoreType && getSpecies(att.species).types.includes(move.type) ? 1.5 : 1;
    dmg *= stab * eff2;
    dmg *= 0.85 + Math.random() * 0.15;
    return { dmg: Math.max(1, Math.floor(dmg)), eff, crit };
  }

  accuracyCheck(side, move) {
    if (move.acc == null) return true;
    const a = accMul(this.stages[side].acc) / accMul(this.stages[this.other(side)].eva);
    return Math.random() * 100 < move.acc * a;
  }

  // ------------------------------------------------------------- a turn --
  /**
   * @param action {type:'move',index} | {type:'item',id} | {type:'switch',index} | {type:'run'}
   * @returns event list
   */
  takeTurn(action) {
    const ev = [];
    this.turn++;
    this.markParticipant();

    // --- non-move player actions resolve first, then the foe attacks
    if (action.type === 'run') {
      if (this.tryRun(ev)) return ev;
      this.foePhase(ev);
      this.endOfTurn(ev);
      return ev;
    }
    if (action.type === 'item') {
      this.useItem(action, ev);
      if (this.over) return ev;
      this.foePhase(ev);
      this.endOfTurn(ev);
      return ev;
    }
    if (action.type === 'switch') {
      this.switchIn('player', action.index, ev);
      if (this.over) return ev;
      this.foePhase(ev);
      this.endOfTurn(ev);
      return ev;
    }

    // --- both sides picked a move: order by priority then speed
    const myMove = action.index < 0 ? STRUGGLE : getMove(this.me.moves[action.index].id);
    const foeMoveIndex = this.chooseFoeMove();
    const foeMove = foeMoveIndex < 0 ? STRUGGLE : getMove(this.foe.moves[foeMoveIndex].id);

    const mySpeed = this.effStat('player', 'spe');
    const foeSpeed = this.effStat('foe', 'spe');
    const myFirst = myMove.priority !== foeMove.priority
      ? myMove.priority > foeMove.priority
      : mySpeed !== foeSpeed ? mySpeed > foeSpeed : chance(0.5);

    const order = myFirst
      ? [['player', myMove, action.index], ['foe', foeMove, foeMoveIndex]]
      : [['foe', foeMove, foeMoveIndex], ['player', myMove, action.index]];

    for (const [side, move, idx] of order) {
      if (this.over) break;
      if (this.actor(side).hp <= 0) continue;
      this.performMove(side, move, idx, ev);
      this.checkFaints(ev);
    }
    if (!this.over) this.endOfTurn(ev);
    return ev;
  }

  /** The foe acts alone (after an item / switch / failed run). */
  foePhase(ev) {
    if (this.over || this.foe.hp <= 0) return;
    const idx = this.chooseFoeMove();
    this.performMove('foe', idx < 0 ? STRUGGLE : getMove(this.foe.moves[idx].id), idx, ev);
    this.checkFaints(ev);
  }

  performMove(side, move, idx, ev) {
    const c = this.actor(side);
    const vol = this.volatile[side];
    const name = displayName(c);
    const label = side === 'player' ? name : `${name} של היריב`;

    if (vol.recharge) {
      vol.recharge = false;
      ev.push({ t: 'msg', text: `${label} מתאושש מהמהלך הקודם…` });
      return;
    }
    // --- pre-move status gates
    if (c.status === 'sleep') {
      if (c.sleepTurns > 0) c.sleepTurns--;
      if (c.sleepTurns <= 0) {
        c.status = 'none';
        ev.push({ t: 'status', side, status: 'none' });
        ev.push({ t: 'msg', text: `${label} התעורר!` });
      } else {
        ev.push({ t: 'msg', text: `${label} ישן עמוק…` });
        return;
      }
    }
    if (c.status === 'freeze') {
      if (chance(0.2)) {
        c.status = 'none';
        ev.push({ t: 'status', side, status: 'none' });
        ev.push({ t: 'msg', text: `${label} הפשיר!` });
      } else {
        ev.push({ t: 'msg', text: `${label} קפוא ולא יכול לזוז!` });
        return;
      }
    }
    if (vol.flinch) {
      vol.flinch = false;
      ev.push({ t: 'msg', text: `${label} נרתע ולא הספיק לפעול!` });
      return;
    }
    if (c.status === 'para' && chance(0.25)) {
      ev.push({ t: 'msg', text: `${label} משותק ולא מסוגל לזוז!` });
      return;
    }
    if (vol.confusion > 0) {
      vol.confusion--;
      if (vol.confusion === 0) {
        ev.push({ t: 'msg', text: `${label} התנקה מהבלבול!` });
      } else {
        ev.push({ t: 'msg', text: `${label} מבולבל…` });
        if (chance(1 / 3)) {
          const self = Math.floor(
            Math.floor(Math.floor((2 * c.level) / 5 + 2) * 40 * this.effStat(side, 'atk') / this.effStat(side, 'def')) / 50) + 2;
          ev.push({ t: 'anim', fx: 'impact', side, type: 'neutral' });
          this.damage(side, self, ev, { self: true });
          ev.push({ t: 'msg', text: `${label} פגע בעצמו בבלבול!` });
          return;
        }
      }
    }

    // --- PP (Struggle, idx < 0, costs nothing)
    if (idx >= 0) {
      const slot = c.moves[idx];
      if (slot.pp <= 0) {
        ev.push({ t: 'msg', text: `${label} ניסה להשתמש במהלך — אבל אין נקודות שימוש!` });
        return;
      }
      slot.pp--;
    }
    ev.push({ t: 'msg', text: `${label} השתמש ב${move.name}!` });

    if (!this.accuracyCheck(side, move)) {
      ev.push({ t: 'msg', text: `${label} החטיא!` });
      return;
    }

    const foeSide = this.other(side);
    const target = this.actor(foeSide);

    // --- status moves
    if (move.cat === 'status') {
      ev.push({ t: 'anim', fx: move.fx, side, type: move.type, status: true });
      this.applyRiders(side, move, 0, ev, true);
      return;
    }

    // --- damaging moves
    const hits = move.eff?.multi ? rangeInt(move.eff.multi[0], move.eff.multi[1]) : 1;
    let total = 0;
    let eff = 1, crit = false;
    for (let i = 0; i < hits; i++) {
      if (target.hp <= 0) break;
      const r = this.computeDamage(side, move);
      eff = r.eff; crit = crit || r.crit;
      if (eff === 0) break;
      ev.push({ t: 'anim', fx: move.fx, side, type: move.type });
      total += this.damage(foeSide, r.dmg, ev, { crit: r.crit, eff: r.eff });
    }
    if (eff === 0) {
      ev.push({ t: 'msg', text: `זה לא משפיע על ${displayName(target)}…` });
      return;
    }
    if (hits > 1) ev.push({ t: 'msg', text: `נחת ${hits} פעמים!` });
    if (crit) ev.push({ t: 'msg', text: 'פגיעה קריטית!' });
    const lbl = effectivenessLabel(eff);
    if (lbl) ev.push({ t: 'msg', text: lbl });

    this.applyRiders(side, move, total, ev, false);
  }

  applyRiders(side, move, dealt, ev, isStatus) {
    const e = move.eff;
    if (!e) return;
    const foeSide = this.other(side);
    const roll = e.chance ?? 1;

    if (e.stat && (isStatus || chance(roll))) {
      const who = e.stat.who === 'self' ? side : foeSide;
      if (this.actor(who).hp > 0) this.applyStage(who, e.stat.stat, e.stat.stages, ev);
    }
    if (e.statSelf2) this.applyStage(side, e.statSelf2.stat, e.statSelf2.stages, ev);
    if (e.statSelf) this.applyStage(side, e.statSelf.stat, e.statSelf.stages, ev);

    if (e.status && chance(roll) && this.actor(foeSide).hp > 0) {
      this.setStatus(foeSide, e.status, ev);
    }
    if (e.confuse && chance(e.confuse)) {
      const v = this.volatile[foeSide];
      if (v.confusion === 0 && this.actor(foeSide).hp > 0) {
        v.confusion = rangeInt(2, 5);
        ev.push({ t: 'msg', text: `${displayName(this.actor(foeSide))} התבלבל!` });
      }
    }
    if (e.flinch && chance(e.flinch)) this.volatile[foeSide].flinch = true;
    if (e.drain && dealt > 0) {
      const got = this.heal(side, dealt * e.drain, ev);
      if (got > 0) ev.push({ t: 'msg', text: `${displayName(this.actor(side))} ספג אנרגיה!` });
    }
    if (e.recoil && dealt > 0) {
      this.damage(side, dealt * e.recoil, ev, { self: true });
      ev.push({ t: 'msg', text: `${displayName(this.actor(side))} נפגע מהריקול!` });
    }
    if (e.healSelf) {
      const c = this.actor(side);
      if (c.hp >= c.stats.hp) ev.push({ t: 'msg', text: 'אבל שום דבר לא קרה!' });
      else {
        this.heal(side, c.stats.hp * e.healSelf, ev);
        ev.push({ t: 'msg', text: `${displayName(c)} התאושש!` });
      }
    }
    if (e.recharge) this.volatile[side].recharge = true;
  }

  // ------------------------------------------------------ end of turn ----
  endOfTurn(ev) {
    for (const side of ['player', 'foe']) {
      const c = this.actor(side);
      if (!c || c.hp <= 0) continue;
      const label = side === 'player' ? displayName(c) : `${displayName(c)} של היריב`;
      if (c.status === 'burn') {
        this.damage(side, c.stats.hp / 16, ev, { self: true });
        ev.push({ t: 'msg', text: `${label} נפגע מהכווייה!` });
      } else if (c.status === 'poison') {
        this.damage(side, c.stats.hp / 8, ev, { self: true });
        ev.push({ t: 'msg', text: `${label} נפגע מהרעל!` });
      }
    }
    this.checkFaints(ev);
  }

  checkFaints(ev) {
    if (this.over) return;
    if (this.foe.hp <= 0) {
      ev.push({ t: 'faint', side: 'foe' });
      ev.push({ t: 'msg', text: `${displayName(this.foe)} של היריב התעלף!` });
      this.awardExp(ev);
      const next = this.foeParty.findIndex((c) => c.hp > 0);
      if (next === -1) {
        this.finishWin(ev);
      } else {
        this.fIndex = next;
        this.stages.foe = freshStages();
        this.volatile.foe = freshVolatile();
        ev.push({ t: 'msg', text: `${this.trainer?.name || 'היריב'} שולח את ${displayName(this.foe)}!` });
        ev.push({ t: 'sendout', side: 'foe', creature: this.foe });
      }
      return;
    }
    if (this.me.hp <= 0) {
      ev.push({ t: 'faint', side: 'player' });
      ev.push({ t: 'msg', text: `${displayName(this.me)} התעלף!` });
      const alive = this.party.some((c) => c.hp > 0);
      if (!alive) {
        this.over = true;
        this.result = 'lose';
        ev.push({ t: 'msg', text: 'אין לך עוד יצורים כשירים…' });
        ev.push({ t: 'end', result: 'lose' });
      } else {
        ev.push({ t: 'forceSwitch' });
      }
    }
  }

  finishWin(ev) {
    this.over = true;
    this.result = 'win';
    if (this.kind === 'trainer') {
      ev.push({ t: 'msg', text: this.trainer.defeat });
      ev.push({ t: 'msg', text: `קיבלת ${this.trainer.reward} מטבעות!` });
    }
    ev.push({ t: 'end', result: 'win' });
  }

  awardExp(ev) {
    const fainted = this.foe;
    const share = [...this.participants]
      .map((uid) => this.party.find((c) => c.uid === uid))
      .filter((c) => c && c.hp > 0);
    if (!share.length && this.me.hp > 0) share.push(this.me);
    const base = expAward(fainted, this.kind === 'trainer');
    const each = Math.max(1, Math.floor(base / Math.max(1, share.length)));
    for (const c of share) {
      const before = c.level;
      const res = gainExp(c, each);
      ev.push({ t: 'exp', creature: c, amount: each, result: res, fromLevel: before });
    }
  }

  // ----------------------------------------------------------- actions ---
  switchIn(side, index, ev) {
    if (side === 'player') {
      const out = this.me;
      if (out && out.hp > 0) ev.push({ t: 'msg', text: `חזור, ${displayName(out)}!` });
      ev.push({ t: 'withdraw', side: 'player' });
      this.pIndex = index;
      this.stages.player = freshStages();
      this.volatile.player = freshVolatile();
      ev.push({ t: 'msg', text: `קדימה, ${displayName(this.me)}!` });
      ev.push({ t: 'sendout', side: 'player', creature: this.me });
      this.markParticipant();
    }
  }

  useItem(action, ev) {
    const item = getItem(action.id);
    const target = action.targetIndex != null ? this.party[action.targetIndex] : this.me;
    ev.push({ t: 'msg', text: `השתמשת ב${item.name}.` });

    if (item.kind === 'ball') {
      this.throwBall(item, ev);
      return;
    }
    if (item.kind === 'heal') {
      const before = target.hp;
      target.hp = clamp(target.hp + item.hp, 0, target.stats.hp);
      if (target === this.me) ev.push({ t: 'hp', side: 'player', from: before, to: target.hp, heal: true });
      ev.push({ t: 'msg', text: `${displayName(target)} התאושש ב־${target.hp - before} נקודות חיים.` });
      if (item.cure === 'all') { target.status = 'none'; target.sleepTurns = 0; }
    } else if (item.kind === 'cure') {
      if (target.status === item.cure) {
        target.status = 'none'; target.sleepTurns = 0;
        ev.push({ t: 'msg', text: `${displayName(target)} החלים.` });
      } else ev.push({ t: 'msg', text: 'לא הייתה לזה שום השפעה…' });
    } else if (item.kind === 'revive') {
      if (target.hp <= 0) {
        target.hp = Math.max(1, Math.floor(target.stats.hp * item.ratio));
        ev.push({ t: 'msg', text: `${displayName(target)} חזר להכרה!` });
      } else ev.push({ t: 'msg', text: 'לא הייתה לזה שום השפעה…' });
    } else if (item.kind === 'pp') {
      const slot = target.moves.find((m) => m.pp < m.maxPp);
      if (slot) {
        slot.pp = Math.min(slot.maxPp, slot.pp + item.pp);
        ev.push({ t: 'msg', text: `נקודות השימוש של ${getMove(slot.id).name} התמלאו.` });
      } else ev.push({ t: 'msg', text: 'לא הייתה לזה שום השפעה…' });
    }
    this.state?.removeItem(action.id, 1);
  }

  throwBall(item, ev) {
    this.state?.removeItem(item.id, 1);
    if (this.kind === 'trainer') {
      ev.push({ t: 'msg', text: 'אסור לגנוב את היצורים של מאמן אחר!' });
      return;
    }
    const c = this.foe;
    const sp = getSpecies(c.species);
    const statusBonus = ['sleep', 'freeze'].includes(c.status) ? 2
      : ['para', 'poison', 'burn'].includes(c.status) ? 1.5 : 1;
    const a = ((3 * c.stats.hp - 2 * c.hp) * sp.catchRate * item.rate * statusBonus) / (3 * c.stats.hp);
    const shakesNeeded = 4;
    let shakes = 0;
    if (a >= 255) shakes = shakesNeeded;
    else {
      const b = 1048560 / Math.sqrt(Math.sqrt(16711680 / Math.max(1, a)));
      for (let i = 0; i < shakesNeeded; i++) {
        if (rndInt(65536) < b) shakes++; else break;
      }
    }
    const caught = shakes >= shakesNeeded;
    ev.push({ t: 'ball', item: item.id, shakes, caught });
    if (caught) {
      this.over = true;
      this.result = 'caught';
      ev.push({ t: 'msg', text: `${displayName(c)} נלכד!` });
      ev.push({ t: 'end', result: 'caught', creature: c });
    } else {
      const msg = shakes === 0 ? 'הוא השתחרר מיד!'
        : shakes === 1 ? 'כמעט… אבל הוא נמלט.'
        : shakes === 2 ? 'כל כך קרוב!'
        : 'עוד רגע והוא היה נתפס!';
      ev.push({ t: 'msg', text: msg });
    }
  }

  tryRun(ev) {
    if (this.kind === 'trainer') {
      ev.push({ t: 'msg', text: 'אי אפשר לברוח מקרב מאמנים!' });
      return false;
    }
    this.runAttempts++;
    const A = this.effStat('player', 'spe');
    const B = this.effStat('foe', 'spe');
    const F = B <= 0 ? 999 : ((A * 32) / Math.max(1, Math.floor(B / 4) % 256)) + 30 * this.runAttempts;
    if (rndInt(256) < F) {
      this.over = true;
      this.result = 'run';
      ev.push({ t: 'msg', text: 'ברחת בשלום!' });
      ev.push({ t: 'end', result: 'run' });
      return true;
    }
    ev.push({ t: 'msg', text: 'לא הצלחת לברוח!' });
    return false;
  }

  // ---------------------------------------------------------------- AI ---
  chooseFoeMove() {
    const c = this.foe;
